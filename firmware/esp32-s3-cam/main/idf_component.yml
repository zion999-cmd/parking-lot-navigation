## Managed component dependencies.
##
## esp32-camera is pinned to 2.1.5 on purpose: that is the exact version that
## already ran on this piece of hardware (see
## /Users/bx/Esp32/xiaozhi-esp32-224/dependencies.lock and its runtime log
## "camera: Detected OV3660 camera"). Do not bump it without re-running the
## P0001 acceptance test.
##
## 78/esp-wifi-connect is the reference project's Wi-Fi provisioning component
## (SoftAP + captive portal + NVS credentials). It is MIT licensed and is reused
## as-is rather than reimplemented. Version range matches the reference project.
dependencies:
  idf: ">=5.5.2"
  espressif/esp32-camera: "2.1.5"
  78/esp-wifi-connect: "~3.1.1"
