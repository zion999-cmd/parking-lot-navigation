<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>停车场导航 — Route 可视化</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
         margin: 0; background: #14161a; color: #e6e6e6; display: flex;
         flex-direction: column; align-items: center; }
  header { width: min(96vw, 1100px); padding: 14px 0 6px; }
  h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  #result { font-size: 15px; padding: 8px 12px; border-radius: 6px;
            background: #1d2026; border-left: 4px solid #666; }
  #result.ok { border-left-color: #37d67a; }
  #result.bad { border-left-color: #ff5c5c; }
  #meta { color: #8b93a0; font-size: 12px; margin-top: 6px; }
  canvas { background: #0b0d10; border: 1px solid #2a2f38; border-radius: 6px;
           width: min(96vw, 1100px); height: auto; image-rendering: pixelated; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px;
            color: #b9c0cc; padding: 10px 0 24px; width: min(96vw, 1100px); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  button { background: #2a2f38; color: #e6e6e6; border: 1px solid #3a4049;
           border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #353b45; }
</style>
</head>
<body>
<header>
  <h1>停车场导航 — Route 可视化</h1>
  <div id="result">加载中…</div>
  <div id="meta"></div>
</header>
<canvas id="map" width="800" height="600"></canvas>
<div class="legend">
  <span><i class="sw" style="background:#1f7a44"></i>EMPTY 空</span>
  <span><i class="sw" style="background:#8c2f2f"></i>OCCUPIED 有车</span>
  <span><i class="sw" style="background:#4a4f57"></i>UNKNOWN 不知道</span>
  <span><i class="sw" style="background:#2a2f38;border:1px solid #4a4f57"></i>道路节点/边</span>
  <span><i class="sw" style="background:#ffd166"></i>规划路线</span>
  <span><i class="sw" style="background:#ff7a45;border-radius:50%"></i>红色主车（实心点=车头）</span>
  <span><i class="sw" style="background:none;border:2px solid #66d9ff"></i>目标车位</span>
  <span><i class="sw" style="background:none;border:2px solid #ff9f45"></i>你点的车位</span>
  <span>👆 点车位即规划，路线会跟着主车走</span>
  <button onclick="reloadAll()">重新加载地图和状态</button>
</div>

<script>
// Everything comes from the two contract documents P0002 emits, plus the route P0003 planned.
// No geometry is duplicated here: the map already has the nodes, the edges and the bay
// polygons, and the route is a list of node ids. This page only draws.
const DOCS = { map: "../out/parking_map.json",
               state: "../out/parking_state.json",
               route: "../out/route.json" };

async function getJSON(url) {
  try {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

const cv = document.getElementById("map");
const ctx = cv.getContext("2d");

// The three documents as last loaded, plus the bay the user last clicked. Clicking a bay calls
// the endpoint, which runs the same planner src/plan.py runs; this page still does not decide
// anything - it asks and draws what comes back.
let MAP = null, STATE = null, ROUTE = null, PICKED = null, HOVER = null;
let LAST = null;            // where the hero was when the page last planned
let busy = false;           // one request at a time, so a slow reply cannot pile up
let polls = 0;

// The map is 41.8 KB and never changes while you are driving, so it is not part of the fast
// poll; the state is 3.8 KB and the route 0.5 KB. Reloading the map every 20 s keeps edit-and-
// look working without spending the poll on it.
const MAP_EVERY_POLLS = 40;      // 40 x 500 ms
const POLL_MS = 500;             // main.py writes the state every 0.5 s; that is the cadence to match
const REPLAN_MOVE_PX = 4;        // road nodes are tens of px apart, so this is smaller than a node
const REPLAN_AFTER_MS = 1500;    // past a couple of state writes, so a bay taken meanwhile shows up

// A plan is a snapshot of where the hero was; the hero keeps driving. Re-plan when the start has
// moved enough to change the answer, or when enough time has passed for an occupancy to have
// changed - someone may park in the bay you are driving to, and that has to turn into a refusal
// rather than stay a stale yellow line.
// The route is a list of graph nodes, and the first of them is the node the car is at or nearest
// to - which can be a bay's mouth, because a bay's access point is a node on the graph. So a line
// drawn from that node alone can look as if it starts inside a bay. Drawing the car's own leg
// first says what is true: the car drives there, and the planned route begins after that.
function routePolyline(stateDoc, routeDoc, nodes) {
  const ids = (routeDoc && routeDoc.ok && routeDoc.nodes) || [];
  const points = ids.map(id => nodes[id]).filter(Boolean).map(n => [n.x, n.y]);
  if (!points.length) return { points: [], carLeg: false };
  const v = stateDoc && stateDoc.vehicle;
  if (v && v.visible !== false && typeof v.x === "number" && typeof v.y === "number")
    return { points: [[v.x, v.y], ...points], carLeg: true };
  return { points: points, carLeg: false };
}

function shouldReplan(stateDoc, last, picked, now) {
  if (picked == null) return false;
  if (!last) return true;
  if (now - last.at >= REPLAN_AFTER_MS) return true;
  const v = stateDoc && stateDoc.vehicle;
  if (!v || v.visible === false) return false;
  if (typeof v.x !== "number" || typeof v.y !== "number") return false;
  if (last.x == null || last.y == null) return true;       // it came back into view
  return Math.hypot(v.x - last.x, v.y - last.y) >= REPLAN_MOVE_PX;
}

function redraw() { if (MAP) draw(MAP, STATE, ROUTE, PICKED, HOVER); }

function spotColours(state) {
  if (state === "OCCUPIED") return { fill: "rgba(140,47,47,.55)", line: "#ff6b6b" };
  if (state === "EMPTY")    return { fill: "rgba(31,122,68,.45)", line: "#37d67a" };
  return { fill: "rgba(74,79,87,.35)", line: "#6b7280" };   // UNKNOWN
}

function draw(mapDoc, stateDoc, routeDoc, picked, hover) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const nodes = {};
  for (const n of (mapDoc.road_network?.nodes ?? [])) nodes[n.id] = n;
  const edges = mapDoc.road_network?.edges ?? [];
  const states = stateDoc?.spots ?? {};

  // roads first, so everything else sits on top
  ctx.lineWidth = 2;
  for (const e of edges) {
    const a = nodes[e.from], b = nodes[e.to];
    if (!a || !b) continue;
    ctx.strokeStyle = e.bidirectional === false ? "#6b7280" : "#2a2f38";
    if (e.bidirectional === false) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.fillStyle = "#3a4049";
  for (const id in nodes) { const n = nodes[id]; ctx.fillRect(n.x - 1, n.y - 1, 2, 2); }

  // bays, coloured by what the state document says
  for (const s of (mapDoc.spots ?? [])) {
    const c = spotColours(states[s.id]?.state);
    ctx.beginPath();
    s.polygon.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.fillStyle = c.fill; ctx.fill();
    ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.stroke();
  }

  // the car park gate
  for (const g of (mapDoc.entrances ?? [])) {
    const n = nodes[g.node];
    if (!n) continue;
    ctx.beginPath(); ctx.arc(n.x, n.y, 7, 0, Math.PI * 2);
    ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#c084fc"; ctx.font = "11px system-ui";
    ctx.fillText("门 " + g.node, n.x + 10, n.y - 8);
  }

  // the planned route
  const leg = routePolyline(stateDoc, routeDoc, nodes);
  if (leg.points.length > 1) {
    if (leg.carLeg) {                       // the leg from the car to the graph node it uses
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(leg.points[0][0], leg.points[0][1]);
      ctx.lineTo(leg.points[1][0], leg.points[1][1]);
      ctx.strokeStyle = "rgba(255,122,69,.85)"; ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    const road = leg.points.slice(leg.carLeg ? 1 : 0);
    ctx.beginPath();
    road.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 4; ctx.lineJoin = "round";
    ctx.stroke();
    for (const p of road) {
      ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd166"; ctx.fill();
    }
    // the node the route starts from, named, so nobody has to guess where the line begins
    ctx.fillStyle = "#ffd166"; ctx.font = "11px system-ui";
    ctx.fillText(leg.carLeg ? "起点（车先到这）" : "起点", road[0][0] + 8, road[0][1] - 8);
  }

  // the bay under the pointer, and the one that was clicked - the latter matters when the
  // route was refused, because then there is no route to point at it
  for (const [id, colour, width] of [[hover, "rgba(255,255,255,.75)", 2],
                                     [picked, "#ff9f45", 3]]) {
    if (id == null) continue;
    const s = (mapDoc.spots ?? []).find(x => String(x.id) === String(id));
    if (!s) continue;
    ctx.beginPath();
    s.polygon.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath(); ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.stroke();
  }

  // the target bay
  const target = (mapDoc.spots ?? []).find(s => String(s.id) === String(routeDoc?.target_spot));
  if (target) {
    ctx.beginPath();
    target.polygon.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.strokeStyle = "#66d9ff"; ctx.lineWidth = 3; ctx.stroke();
    const [cx, cy] = target.polygon.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0])
                                    .map(v => v / target.polygon.length);
    ctx.fillStyle = "#66d9ff"; ctx.font = "bold 13px system-ui";
    ctx.fillText("目标 " + target.id, cx - 22, cy + 4);
  }

  // the hero: filled dot at the front, hollow at the back, line along the axis
  const v = stateDoc?.vehicle;
  if (v?.visible) {
    const r = 8;
    if (v.front_is_known && v.front_heading != null) {
      const a = v.front_heading * Math.PI / 180;
      const fx = v.x + r * 1.6 * Math.cos(a), fy = v.y + r * 1.6 * Math.sin(a);
      const bx = v.x - r * 1.6 * Math.cos(a), by = v.y - r * 1.6 * Math.sin(a);
      ctx.strokeStyle = "#ff7a45"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fillStyle = "#ff7a45"; ctx.fill();
      ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.stroke();
    } else {
      const a = (v.heading ?? 0) * Math.PI / 180;
      const p = [[v.x + r * 1.6 * Math.cos(a), v.y + r * 1.6 * Math.sin(a)],
                 [v.x - r * 1.6 * Math.cos(a), v.y - r * 1.6 * Math.sin(a)]];
      ctx.strokeStyle = "#ff7a45"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[1][0], p[1][1]); ctx.stroke();
      for (const q of p) { ctx.beginPath(); ctx.arc(q[0], q[1], 5, 0, Math.PI * 2); ctx.stroke(); }
    }
    ctx.beginPath(); ctx.arc(v.x, v.y, 3, 0, Math.PI * 2); ctx.fillStyle = "#ff7a45"; ctx.fill();
    ctx.fillStyle = "#ff7a45"; ctx.font = "11px system-ui";
    ctx.fillText("主车", v.x + 12, v.y + 4);
  }
}

function say(routeDoc) {
  const el = document.getElementById("result");
  if (!routeDoc) { el.className = ""; el.textContent = "还没有规划过路线 —— 跑一次 src/plan.py"; return; }
  if (routeDoc.ok) {
    el.className = "ok";
    el.textContent = `目标 ${routeDoc.target_spot}：${routeDoc.start_node} → ${routeDoc.target_node}`
                   + `，共 ${routeDoc.nodes.length} 个节点，${routeDoc.distance} px`;
  } else {
    el.className = "bad";
    el.textContent = `拒绝（${routeDoc.code}）：${routeDoc.reason}`;
  }
}

// --- clicking a bay ---------------------------------------------------------

function canvasPoint(evt) {                     // the canvas is scaled by CSS, so convert
  const r = cv.getBoundingClientRect();
  return { x: (evt.clientX - r.left) * cv.width / r.width,
           y: (evt.clientY - r.top) * cv.height / r.height };
}

function inside(polygon, x, y) {                // ray casting
  let hit = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const [xi, yi] = polygon[i], [xj, yj] = polygon[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) hit = !hit;
  }
  return hit;
}

function bayAt(x, y) {
  return (MAP?.spots ?? []).find(s => inside(s.polygon, x, y)) ?? null;
}

async function planSpot(id, quiet) {
  PICKED = String(id);
  const el = document.getElementById("result");
  if (!quiet) { el.className = ""; el.textContent = `正在规划到 ${PICKED} 的路线…`; }
  try {
    const r = await fetch(`/api/route?spot=${encodeURIComponent(PICKED)}&t=${Date.now()}`);
    ROUTE = await r.json();
  } catch (err) {                    // the endpoint being down is not a planner refusal
    ROUTE = { ok: false, code: "endpoint-unreachable", target_spot: PICKED,
              reason: `调用接口失败：${err}. 是不是没在跑 src/serve.py？`, nodes: [] };
  }
  // Remember the start this plan was made from, so the next poll can tell whether it still fits.
  const v = STATE && STATE.vehicle;
  LAST = { x: (v && typeof v.x === "number") ? v.x : null,
           y: (v && typeof v.y === "number") ? v.y : null,
           at: Date.now() };
  redraw();
  say(ROUTE);
  meta();
}

cv.addEventListener("click", evt => {
  const p = canvasPoint(evt), s = bayAt(p.x, p.y);
  if (s) planSpot(s.id);
});

cv.addEventListener("mousemove", evt => {
  const p = canvasPoint(evt), s = bayAt(p.x, p.y);
  cv.style.cursor = s ? "pointer" : "default";
  const id = s ? String(s.id) : null;
  if (id !== HOVER) { HOVER = id; redraw(); }
});

async function loadMap() {
  const mapDoc = await getJSON(DOCS.map);
  if (!mapDoc) {
    document.getElementById("result").className = "";
    document.getElementById("result").textContent =
      "读不到 parking_map.json —— 先在 vision/ 目录下跑 src/emit_map.py 和 src/serve.py";
    return false;
  }
  MAP = mapDoc;
  return true;
}

async function reloadAll() {
  await loadMap();
  STATE = await getJSON(DOCS.state) ?? STATE;
  if (PICKED == null) ROUTE = await getJSON(DOCS.route) ?? ROUTE;
  redraw(); say(ROUTE); meta();
}

function age(t) {                       // t is seconds; the page'\''s own clock, not the server'\''s
  if (!t) return "—";
  const s = Math.max(0, Date.now() / 1000 - t);
  return s < 1.05 ? `${s.toFixed(1)} 秒前` : `${Math.round(s)} 秒前`;
}

function meta() {
  const routeAge = LAST ? (Date.now() - LAST.at) / 1000 : null;
  const shown = routeAge == null ? "尚未在本页规划"
              : `重规划于 ${routeAge < 1.05 ? routeAge.toFixed(1) : Math.round(routeAge)} 秒前`;
  document.getElementById("meta").textContent =
    `state ${age(STATE?.timestamp)}   route ${shown}   `
    + (PICKED == null
        ? "点一个车位开始规划（EMPTY 才有路线；OCCUPIED / UNKNOWN 会原样返回拒绝码）"
        : `跟随主车实时重规划中，目标 ${PICKED}（再点别的车位可换目标）`);
}

// The fast loop: the state, and a re-plan when it is warranted. Nothing else.
async function poll() {
  if (busy || !MAP) return;
  busy = true;
  try {
    const stateDoc = await getJSON(DOCS.state);
    if (stateDoc) STATE = stateDoc;
    if (shouldReplan(STATE, LAST, PICKED, Date.now())) {
      await planSpot(PICKED, true);                 // silent: the line should not flash at 2 Hz
    } else if (PICKED == null) {
      const routeDoc = await getJSON(DOCS.route);   // not following: show what plan.py last wrote
      if (routeDoc) ROUTE = routeDoc;
    }
    if (++polls % MAP_EVERY_POLLS === 0) await loadMap();
    redraw(); say(ROUTE); meta();
  } finally { busy = false; }
}

reloadAll();
setInterval(poll, POLL_MS);      // the state is 3.8 KB; the route is a 0.5 KB answer
</script>
</body>
</html>
