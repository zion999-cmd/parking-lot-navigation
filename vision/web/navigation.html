<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>停车场导航</title>
<!--
  The car's view. This page is a pure consumer of the three documents - parking_map.json,
  parking_state.json and the route endpoint - and nothing else. It does not recognise anything,
  it does not plan anything: the perception system says where the car and the free bays are, the
  planner hands back a sequence of node ids, and this page turns those into the picture a driver
  looks at. It is deliberately independent from board.html, which is the expert/perception page;
  board keeps its analysed camera stream, and this page shows no camera at all.

  The adapter between the two layers is the set of small pure functions below (Nav.*): point in
  polygon, metres, the follow camera, turn instruction, arrival. They translate the contract into
  screen terms without changing it, and they are the pieces the tests run in node.
-->
<style>
  :root { color-scheme: light; --ground:#e9edf1; --sheet:#ffffff; --sheet-line:#e7eaef;
          --ink:#0f141a; --sub:#5b6572; --route:#1f7aff; --target:#ff3b30; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ margin:0; overflow:hidden; background:var(--ground); color:var(--ink);
        font:16px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #map{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* one small hint at the top: where you are / what is happening - not a panel */
  .topbar{ position:fixed; top:14px; left:0; right:0; display:flex; justify-content:center;
           z-index:2; pointer-events:none; }
  #statusPill{ background:rgba(255,255,255,.85); border:1px solid rgba(0,0,0,.06);
               border-radius:999px; padding:7px 16px; font-size:13.5px; color:var(--sub);
               backdrop-filter:blur(8px); box-shadow:0 2px 12px rgba(20,30,50,.10); }
  #statusPill b{ color:var(--ink); }

  /* the navigation sheet: docked to the bottom, part of the screen (never a centred modal) */
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:3; background:var(--sheet);
          border-top:1px solid var(--sheet-line); border-radius:22px 22px 0 0;
          padding:8px 20px calc(18px + env(safe-area-inset-bottom));
          box-shadow:0 -12px 40px rgba(20,30,50,.16); }
  .grab{ width:42px; height:4px; border-radius:2px; background:#e4e8ed; margin:4px auto 12px; }
  .head{ display:flex; align-items:center; justify-content:space-between; }
  .dest{ display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600; }
  .dest .pin{ width:20px; height:20px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
              background:var(--target); position:relative; flex:0 0 auto; }
  .dest .pin::after{ content:""; position:absolute; inset:0; margin:auto; width:8px; height:8px;
                     border-radius:50%; background:#fff; }
  #cancelBtn{ background:transparent; border:0; color:var(--sub); font:inherit; font-size:14px;
              font-weight:600; padding:6px 2px; cursor:pointer; }
  .maneuver{ display:flex; align-items:center; gap:14px; margin:10px 0 2px; }
  #arrow{ width:52px; height:52px; flex:0 0 auto; border-radius:14px; font-size:26px;
          display:flex; align-items:center; justify-content:center;
          background:color-mix(in srgb, var(--route) 13%, #fff); }
  #maneuverTxt{ font-size:21px; font-weight:700; }
  .stats{ display:flex; gap:26px; margin-top:12px; padding-top:12px;
          border-top:1px solid var(--sheet-line); }
  .k{ font-size:12px; color:var(--sub); }
  .v{ font-size:23px; font-weight:700; margin-top:1px; }
  .v small{ font-size:12.5px; font-weight:600; color:var(--sub); margin-left:2px; }

  /* choose a bay: the same sheet, listing free bays (no map overlay, no modal) */
  .picklist{ max-height:38vh; overflow:auto; display:flex; flex-direction:column; gap:6px; }
  #toast{ position:fixed; left:50%; top:38%; transform:translate(-50%,-50%) scale(.94); z-index:4;
          background:rgba(255,255,255,.96); border:1px solid rgba(0,0,0,.06); border-radius:18px;
          padding:18px 26px; text-align:center; font-size:19px; font-weight:600; opacity:0;
          transition:opacity .25s, transform .25s; pointer-events:none;
          box-shadow:0 12px 40px rgba(20,30,50,.20); }
  #toast.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast .big{ font-size:30px; margin-bottom:4px; }

  .hidden{ display:none !important; }
  body.navigating #pickSheet, body.arrived #pickSheet{ display:none; }
  body.idle #navSheet{ display:none; }
</style>

<canvas id="map"></canvas>

<div class="topbar"><div id="statusPill">正在连接…</div></div>

<!-- navigating: destination, next maneuver, distance -->
<div class="sheet" id="navSheet">
  <div class="grab"></div>
  <div class="head">
    <div class="dest"><span class="pin"></span>前往 <span id="targetV">–</span> 号车位</div>
    <button id="cancelBtn">结束导航</button>
  </div>
  <div class="maneuver">
    <div id="arrow">•</div>
    <div>
      <div id="maneuverTxt">请选择目标车位</div>
      <div class="k" id="subtitle">–</div>
    </div>
  </div>
  <div class="stats">
    <div><div class="k">剩余距离</div><div class="v" id="distV">–</div></div>
    <div><div class="k">当前状态</div><div class="v" id="title" style="font-size:17px;line-height:1.7">导航中</div></div>
  </div>
</div>

<!-- choosing: no list - the bays on the map are the list -->
<div class="sheet" id="pickSheet">
  <div class="grab"></div>
  <div class="head">
    <div class="dest" style="font-size:16px">点地图上的绿色空车位开始导航</div>
  </div>
</div>

<div id="toast"><div class="big">✅</div><div id="toastTxt"></div></div>

<script>
"use strict";

// ============================================================ the adapter
// Pure functions only here: the contract in, screen/driver terms out. No fetch, no canvas, no
// globals, so the tests can lift these straight out and run them in node.
const PX_PER_M = 20.0;        // an 800x600 image_2d lot: measured bays are ~48px wide and a real
                              // bay is ~2.4m across, so 1 metre is about 20 image pixels.

const Nav = {
  // ---- geometry ---------------------------------------------------------
  pointInPoly(x, y, poly) {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) hit = !hit;
    }
    return hit;
  },
  centroid(poly) {
    let x = 0, y = 0;
    for (const [px, py] of poly) { x += px; y += py; }
    return [x / poly.length, y / poly.length];
  },
  bayAt(mapDoc, x, y) {
    return (mapDoc?.spots ?? []).find(s => this.pointInPoly(x, y, s.polygon)) ?? null;
  },
  nodesIndex(mapDoc) {
    const out = {};
    for (const n of mapDoc?.road_network?.nodes ?? []) out[n.id] = n;
    return out;
  },
  // The route is node ids; resolve them against the map into world points, dropping any id the
  // map no longer has (it can briefly lag an edit) rather than drawing a broken line.
  routePoints(routeDoc, nodes) {
    const ids = (routeDoc?.ok && routeDoc.nodes) || [];
    const points = [];
    let unknown = 0;
    for (const id of ids) {
      if (nodes[id]) points.push([nodes[id].x, nodes[id].y]);
      else unknown += 1;
    }
    return { points, unknown };
  },

  // ---- the road, as continuous lines --------------------------------------
  // Edges are how the map is stored, not how a road looks. Drawn edge by edge, a road made of
  // four stored segments reads as four segments: the lane band shows its seams and the centre
  // dashes restart at every node. Chains merge runs of edges through nodes that are merely
  // somewhere along the road (degree 2) and stop where the road really branches.
  roadChains(nodes, edges) {
    const adj = {};
    const add = (a, b) => { (adj[a] = adj[a] || []).push(b); };
    for (const e of edges) {
      if (!nodes[e.from] || !nodes[e.to]) continue;
      add(e.from, e.to); add(e.to, e.from);
    }
    const degree = id => (adj[id] || []).length;
    const used = new Set();
    const key = (a, b) => a < b ? a + "|" + b : b + "|" + a;
    const chains = [];
    // Carry on through a junction when one way out is plainly the same road continuing. This is
    // the case that matters here: every bay's entrance is a branch off a lane, so a lane has a
    // junction at every bay, and stopping at each of them is what made one road look like forty
    // short ones. The branch is left for its own chain.
    const STRAIGHT_TOL = 50 * Math.PI / 180;
    const walk = (start, next) => {
      const ids = [start, next];
      used.add(key(start, next));
      let prev = start, cur = next;
      for (;;) {
        const options = (adj[cur] || []).filter(id => id !== prev && !used.has(key(cur, id)));
        if (!options.length) break;
        let onward = null;
        if (degree(cur) === 2) {
          onward = options[0];                       // nothing to choose: the road goes on
        } else {
          const into = this.bearing(nodes[prev].x, nodes[prev].y, nodes[cur].x, nodes[cur].y);
          let best = Infinity;
          for (const id of options) {
            const out = this.bearing(nodes[cur].x, nodes[cur].y, nodes[id].x, nodes[id].y);
            const turn = Math.abs(this.turnDeg(into, out));
            if (turn < best) { best = turn; onward = id; }
          }
          if (best > STRAIGHT_TOL * 180 / Math.PI) onward = null;
        }
        if (onward == null) break;
        used.add(key(cur, onward));
        ids.push(onward);
        prev = cur; cur = onward;
      }
      chains.push(ids.map(id => [nodes[id].x, nodes[id].y]));
    };
    // Start at the ends and the junctions first, so a road is traced through from one end to the
    // other rather than in pieces from whatever node happened to come first.
    for (const id of Object.keys(adj)) {
      if (degree(id) === 2) continue;
      for (const other of adj[id]) if (!used.has(key(id, other))) walk(id, other);
    }
    // What is left is loops, which have no end to start from.
    for (const e of edges) {
      if (!nodes[e.from] || !nodes[e.to]) continue;
      if (!used.has(key(e.from, e.to))) walk(e.from, e.to);
    }
    return chains;
  },

  // Closed loops in the road graph, as ordered node ids. A ring drawn edge by edge reads as
  // segments; a loop is one closed path with no end caps, so it is found and drawn once.
  roadLoops(nodes, edges) {
    // 2-core: peel degree-1 nodes (the entrance stub) until only cycle edges remain, then walk
    // each cycle once. A DFS back-edge scan missed this ring entirely; leaf pruning cannot.
    const adj = {};
    for (const e of edges) {
      if (!nodes[e.from] || !nodes[e.to]) continue;
      (adj[e.from] ?? (adj[e.from] = [])).push(e.to);
      (adj[e.to] ?? (adj[e.to] = [])).push(e.from);
    }
    const deg = Object.fromEntries(Object.keys(adj).map(k => [k, adj[k].length]));
    const removed = new Set();
    const leaf = Object.keys(deg).filter(k => deg[k] === 1);
    while (leaf.length) {
      const cur = leaf.pop();
      if (removed.has(cur) || deg[cur] !== 1) continue;
      removed.add(cur);
      for (const nb of adj[cur]) {
        if (removed.has(nb)) continue;
        deg[nb] -= 1;
        if (deg[nb] === 1) leaf.push(nb);
      }
    }
    const onCycle = id => !removed.has(id) && deg[id] >= 2;
    const cycAdj = {};
    for (const id of Object.keys(adj))
      if (onCycle(id)) cycAdj[id] = adj[id].filter(onCycle);

    const loops = [];
    const used = new Set();
    const ekey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
    for (const start of Object.keys(cycAdj)) {
      if (cycAdj[start].every(nb => used.has(ekey(start, nb)))) continue;
      const ring = [start];
      let prev = null, cur = start;
      for (;;) {
        let nxt = null;
        for (const nb of cycAdj[cur])
          if (nb !== prev && !used.has(ekey(cur, nb))) { nxt = nb; break; }
        if (nxt == null || nxt === start) {
          if (nxt === start) { used.add(ekey(cur, start)); ring.push(start); }
          break;
        }
        used.add(ekey(cur, nxt));
        ring.push(nxt);
        prev = cur; cur = nxt;
      }
      if (ring.length >= 4) loops.push(ring);
    }
    return loops;
  },

  // ---- units ------------------------------------------------------------
  metres(px) { return px / PX_PER_M; },
  formatMetres(px) {
    if (px == null || !isFinite(px)) return "–";
    const m = px / PX_PER_M;
    return m >= 100 ? `${Math.round(m)} m` : `${m.toFixed(1)} m`;
  },

  // ---- angles -----------------------------------------------------------
  // The contract measures angles in image coordinates: 0 along +x (right), increasing towards
  // +y (down). That is the same convention canvas rotate() uses, so a car drawn pointing "up"
  // its own local -y rotates correctly by the heading with no axis swap.
  normDeg(a) { return ((a % 360) + 360) % 360; },
  // Signed turn from one bearing to another in -180..180, along the short way.
  turnDeg(from, to) {
    let d = this.normDeg(to - from);
    if (d > 180) d -= 360;
    return d;
  },
  bearing(ax, ay, bx, by) { return this.normDeg(Math.atan2(by - ay, bx - ax) * 180 / Math.PI); },

  // Two angle frames meet here and they must not be mixed. The *map/route* lives in image
  // coordinates: 0 along +x (right), increasing clockwise because +y points down. A *driver*
  // thinks in compass/screen terms: 0 pointing up, increasing clockwise. Comparing one against
  // the other directly mirrors every left/right, so route directions are converted out of the
  // image frame before any maneuver is decided. Pure: image bearing in, driver bearing out.
  imageToDriverDeg(imageDeg) {
    // image 0 (right) is driver 90; image 90 (down) is driver 180.
    return this.normDeg(imageDeg + 90);
  },
  driverBearing(ax, ay, bx, by) {
    return this.imageToDriverDeg(this.bearing(ax, ay, bx, by));
  },
  // Which way to point the car. front_heading is the direction the car faces in 0..360, but it
  // is measured the way the map is: 0 along +x (right), increasing towards +y (down). The icon is
  // drawn nose-up, so it needs the driver frame and every path here goes through the same
  // conversion. Leaving it raw pointed the car 90 degrees off - and a test fixture that supplied
  // an already-converted angle hid it, which is why the fixture below now builds what the camera
  // really emits.
  carHeading(vehicle) {
    if (!vehicle) return null;
    if (vehicle.front_is_known && typeof vehicle.front_heading === "number")
      return this.imageToDriverDeg(vehicle.front_heading);
    // No front: the axis is all there is, so the car may be drawn backwards. Better than
    // pointing it at a right angle to the road it is on.
    if (typeof vehicle.heading === "number") return this.imageToDriverDeg(vehicle.heading);
    return null;
  },

  // ---- remaining distance ----------------------------------------------
  // Sum the route from the node nearest the car to the end, plus the car's gap to that node.
  // This is the number that visibly counts down; planning itself is unchanged upstream.
  remainingPx(vehicle, routeDoc, nodes) {
    const { points } = this.routePoints(routeDoc, nodes);
    if (!points.length) return null;
    if (!vehicle || typeof vehicle.x !== "number") return routeDoc.distance ?? null;
    let best = 0, bestD = Infinity;
    for (let i = 0; i < points.length; i++) {
      const d = Math.hypot(points[i][0] - vehicle.x, points[i][1] - vehicle.y);
      if (d < bestD) { bestD = d; best = i; }
    }
    let total = bestD;
    for (let i = best; i < points.length - 1; i++)
      total += Math.hypot(points[i + 1][0] - points[i][0], points[i + 1][1] - points[i][1]);
    return total;
  },

  // ---- the next maneuver ------------------------------------------------
  // A driving instruction, not a graph fact: compare the route's upcoming bearing with the way
  // the car is facing and say it in the driver's frame.
  maneuver(vehicle, routeDoc, nodes) {
    const { points } = this.routePoints(routeDoc, nodes);
    if (points.length < 2) return { icon: "•", text: "即将到达" };
    if (!vehicle) return { icon: "•", text: "正在重新规划路线…" };
    const heading = this.carHeading(vehicle);
    // Find the first route point ahead of the car.
    let k = 0, bestD = Infinity;
    for (let i = 0; i < points.length; i++) {
      const d = Math.hypot(points[i][0] - vehicle.x, points[i][1] - vehicle.y);
      if (d < bestD) { bestD = d; k = i; }
    }
    if (k >= points.length - 1) return { icon: "🏁", text: "即将到达" };
    const bear = this.driverBearing(points[k][0], points[k][1], points[k + 1][0], points[k + 1][1]);
    const rel = heading == null ? 0 : this.turnDeg(heading, bear);
    const segLen = Math.hypot(points[k + 1][0] - points[k][0], points[k + 1][1] - points[k][1]);
    const far = this.formatMetres(segLen);
    if (Math.abs(rel) <= 22) return { icon: "⬆️", text: `沿通道直行（约 ${far}）` };
    if (rel > 22 && rel <= 60) return { icon: "↗️", text: `前方靠右前行（约 ${far}）` };
    if (rel < -22 && rel >= -60) return { icon: "↖️", text: `前方靠左前行（约 ${far}）` };
    if (rel > 60 && rel <= 150) return { icon: "➡️", text: `前方右转（约 ${far}）` };
    if (rel < -60 && rel >= -150) return { icon: "⬅️", text: `前方左转（约 ${far}）` };
    return { icon: "↩️", text: "前方掉头" };
  },

  // ---- arrival ----------------------------------------------------------
  hasArrived(vehicle, target) {
    if (!vehicle || !target) return false;
    if (typeof vehicle.x !== "number" || typeof vehicle.y !== "number") return false;
    return this.pointInPoly(vehicle.x, vehicle.y, target.polygon);
  },

  // ---- the follow camera ------------------------------------------------
  // World->screen: uniform scale, then centred on a focal point, then rotated so the car's own
  // direction is up. A car navigator turns the map instead of turning the arrow: with the car on
  // a lane that is not vertical, a fixed north-up view shows the route at some angle and the
  // driver has to work out which way is forward.
  fitCamera(viewW, viewH, worldW, worldH, insetBottom = 0) {
    // insetBottom is the height of the sheet docked at the bottom: the lot must fit in the part
    // of the screen a person can actually see, and be centred in that part rather than under the
    // card. (Called with four arguments it behaves exactly as before.)
    const pad = 48;
    const usableH = Math.max(120, viewH - insetBottom);
    const scale = Math.min((viewW - pad * 2) / worldW, (usableH - pad * 2) / worldH);
    // The inset travels with the camera in *screen* space (see applyCamera): the map is rotated
    // heading-up, so shifting the world focal point would move the view sideways instead.
    return { scale, cx: worldW / 2, cy: worldH / 2, inset: insetBottom };
  },
  // Where the focal point is drawn on screen. The driver's composition holds the car centred
  // horizontally and two thirds of the way down, so most of the screen is the road ahead - which
  // is the half of it a driver is about to drive into.
  navAnchor(viewW, viewH, insetBottom = 0, navigating = false, heightFrac = 2 / 3) {
    if (navigating) return [viewW / 2, viewH * heightFrac];
    return [viewW / 2, (viewH - insetBottom) / 2];
  },
  // How far out to sit so that every point of the route is on screen *with the car held at that
  // anchor*. The offsets are rotated into screen axes first: the map is turned heading-up, so a
  // world offset is not a screen offset and measuring them in world axes would be wrong.
  routeAroundScale(viewW, viewH, anchorX, anchorY, rot, car, points,
                   pad = 56, minScale = 0.3, maxScale = 6.0, bottomLimit = null) {
    // bottomLimit is where the docked sheet starts: room below the car is measured to it, not to
    // the bottom of the screen, or the tail of the route hides behind the card.
    const bottom = (bottomLimit == null ? viewH : bottomLimit);
    if (!car || typeof car.x !== "number") return maxScale;
    const c = Math.cos(rot || 0), s = Math.sin(rot || 0);
    let scale = maxScale;
    for (const [x, y] of points || []) {
      const dx = x - car.x, dy = y - car.y;
      const sx = dx * c - dy * s, sy = dx * s + dy * c;      // screen px per unit of scale
      if (Math.abs(sx) > 1e-6) {
        const room = (sx > 0 ? viewW - anchorX : anchorX) - pad;
        scale = Math.min(scale, room / Math.abs(sx));
      }
      if (Math.abs(sy) > 1e-6) {
        const room = (sy > 0 ? bottom - anchorY : anchorY) - pad;
        scale = Math.min(scale, room / Math.abs(sy));
      }
    }
    return Math.max(minScale, Math.min(maxScale, scale));
  },
  followCamera(viewW, viewH, x, y, scale) {
    return { scale, cx: x, cy: y };
  },
  // The overview inset: a small north-up picture of the whole lot in the corner. North-up on
  // purpose - the main view turns with the car, and a second view turning with it would say
  // nothing new; fixed, it is what tells a driver which way round they are.
  miniMapRect(viewW, viewH, insetBottom, worldW, worldH, width = 176, margin = 14) {
    const h = Math.round(width * worldH / Math.max(worldW, 1));
    return { x: viewW - width - margin, y: viewH - insetBottom - h - margin,
             w: width, h };
  },
  // World -> inside the inset. Pure, so the drawing and the click guard agree on where it is.
  miniMapTransform(rect, worldW, worldH) {
    const scale = Math.min(rect.w / Math.max(worldW, 1), rect.h / Math.max(worldH, 1));
    return { scale, ox: rect.x + (rect.w - worldW * scale) / 2,
             oy: rect.y + (rect.h - worldH * scale) / 2 };
  },

  // Is this world point inside the camera's frame, with a margin, above the docked sheet? Used to
  // refuse a framing that would leave the car off screen.
  framesPoint(cam, viewW, viewH, rot, x, y, margin = 24) {
    // Where the point actually lands on screen, rotation included, and it must be inside the part
    // of the screen the sheet does not cover.
    const [sx, sy] = this.toScreen(viewW, viewH, cam, rot, x, y);
    const usableH = Math.max(120, viewH - (cam.inset || 0));
    return sx >= margin && sx <= viewW - margin
        && sy >= margin && sy <= usableH - margin;
  },
  // The angle the world is turned by so that the car's heading points up the screen. Radians, as
  // canvas wants, and null in the north-up view.
  worldRotation(driverHeading) {
    if (driverHeading == null) return 0;
    return -driverHeading * Math.PI / 180;
  },
  // Keep the view inside the lot. Following a car that parks in a corner would otherwise put a
  // third of the screen on ground that is not a car park at all; a real navigator slides the map
  // so the edge stops at the screen edge and the car drifts off centre instead. If the lot is
  // smaller than the view it is simply centred.
  clampCamera(viewW, viewH, cam, worldW, worldH) {
    const halfW = viewW / 2 / cam.scale, halfH = viewH / 2 / cam.scale;
    const cx = (worldW <= halfW * 2) ? worldW / 2
               : Math.min(Math.max(cam.cx, halfW), worldW - halfW);
    const cy = (worldH <= halfH * 2) ? worldH / 2
               : Math.min(Math.max(cam.cy, halfH), worldH - halfH);
    // rot has to come back with it. Leaving it out cost the whole feature: the clamp returns a
    // new object every frame, so cam.rot was undefined again before the renderer looked at it and
    // the map never turned. Only a pixel check caught that - a test that reads the source for
    // "applyCamera(..., cam.rot)" is satisfied by code that cannot run.
    return { scale: cam.scale, cx, cy, rot: cam.rot || 0 };
  },
  // Canvas order: translate to the middle of the view, rotate, scale, then move the world under
  // the focal point. The rotation is applied after the translation, so it is applied about the
  // middle of the screen - which is where the car is drawn.
  applyCamera(ctx, viewW, viewH, cam, rot) {
    // The anchor is where the focal point is drawn, in screen space (see navAnchor) - it carries
    // the docked sheet's lift and, while driving, the one-third height the car is held at. Doing
    // it here rather than in the world keeps it right under rotation.
    ctx.translate(cam.anchorX ?? viewW / 2, cam.anchorY ?? viewH / 2);
    ctx.rotate(rot || 0);
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-cam.cx, -cam.cy);
  },
  toScreen(viewW, viewH, cam, rot, wx, wy) {
    const r = rot || 0, cos = Math.cos(r), sin = Math.sin(r);
    const dx = (wx - cam.cx) * cam.scale, dy = (wy - cam.cy) * cam.scale;
    // The same anchor applyCamera uses, so this stays the true forward map of the renderer.
    return [(cam.anchorX ?? viewW / 2) + dx * cos - dy * sin,
            (cam.anchorY ?? viewH / 2) + dx * sin + dy * cos];
  },
  // The exact inverse, so a click lands on the bay under the pointer in a turned map. It has to
  // be the inverse or the two would drift apart, and clicking a bay would pick its neighbour.
  screenToWorld(viewW, viewH, cam, rot, sx, sy) {
    const r = rot || 0, cos = Math.cos(r), sin = Math.sin(r);
    // Undo the anchor that applyCamera applies - the sheet lift and, while driving, the one-third
    // height. Without this every click was half a sheet too low and landed on the neighbouring bay.
    const dx = sx - (cam.anchorX ?? viewW / 2), dy = sy - (cam.anchorY ?? viewH / 2);
    return [cam.cx + (dx * cos + dy * sin) / cam.scale,
            cam.cy + (-dx * sin + dy * cos) / cam.scale];
  },
};

let viewW0 = 0, viewH0 = 0;

// ============================================================ state
const DOCS = { map: "../out/parking_map.json", state: "../out/parking_state.json",
               route: "../out/route.json" };
const POLL_MS = 250;
const REPLAN_MOVE_PX = 4;
const REPLAN_AFTER_MS = 1500;

let MAP = null, NODES = {}, STATE = null, ROUTE = null;
let PHASE = "IDLE";            // IDLE | NAVIGATING | ARRIVED
let targetId = null;
let lastPlan = { x: null, y: null, at: 0 };
let online = true;          // false while the server is not answering; shown, not spam-retried
let replanSeq = 0;
let waitingNote = 0;

// The smoothly animated car: we render every frame and lerp this display pose towards the last
// reported pose, so the icon glides instead of jumping on each 250 ms poll.
const car = { x: null, y: null, h: null, visible: false };
let cam = { scale: 1, cx: 400, cy: 300, rot: 0 };
let CHAINS = [];        // open road runs, worked out once per map
let LOOPS = [];        // closed road loops (the ring), drawn as one closed path
let targetCam = null;

const cv = document.getElementById("map");
const ctx = cv.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  viewW0 = window.innerWidth; viewH0 = window.innerHeight;
  cv.width = Math.round(viewW0 * DPR);
  cv.height = Math.round(viewH0 * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();
document.body.classList.add("idle");   // start on the choose-a-bay sheet

async function getJSON(url) {
  try {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

const vehicleOf = () => STATE?.vehicle ?? null;

// ============================================================ planning
async function startNavigation(id) {
  targetId = String(id);
  PHASE = "NAVIGATING";
  document.body.classList.remove("arrived");
  lastPlan = { x: null, y: null, at: 0 };
  await requestRoute(true);
  updateHud();
}

async function requestRoute(manual) {
  const mine = ++replanSeq;
  let doc = null;
  try {
    const r = await fetch(`/api/route?spot=${encodeURIComponent(targetId)}&t=${Date.now()}`);
    doc = await r.json();
  } catch (e) {
    doc = null;
  }
  if (mine !== replanSeq) return;
  if (doc) {
    ROUTE = doc;
    const v = vehicleOf();
    lastPlan = { x: v?.x ?? null, y: v?.y ?? null, at: Date.now() };
  } else {
    // Failed: back off a whole replan interval, or the gate refires on the next poll (250 ms) and
    // floods the console while the server is down.
    lastPlan = { x: null, y: null, at: Date.now() };
    if (manual) transient("正在连接导航服务…", "•");
  }
}

// When to ask for a new route. Same policy as board.html, deliberately: moving is the trigger while
// the car is visible, and the timer is the safety net that still fires when it is not - a bay can
// be taken by someone else while the hero is hidden, and that has to be noticed.
function shouldReplan(now) {
  if (PHASE !== "NAVIGATING" || targetId == null) return false;
  if (!lastPlan || lastPlan.at == null) return true;              // nothing planned yet
  if (now - lastPlan.at >= REPLAN_AFTER_MS) return true;          // the parked safety net
  const v = vehicleOf();
  if (!v || v.visible === false) return false;                    // no fix: nothing to compare against
  if (typeof v.x !== "number" || typeof v.y !== "number") return false;
  if (lastPlan.x == null || lastPlan.y == null) return true;      // a fix appeared where there was none
  return Math.hypot(v.x - lastPlan.x, v.y - lastPlan.y) >= REPLAN_MOVE_PX;
}

function cancelNavigation() {
  PHASE = "IDLE"; targetId = null; ROUTE = null;
  document.body.classList.remove("arrived");
  updateHud();
}

// ============================================================ arrival
function checkArrival() {
  if (PHASE !== "NAVIGATING" || targetId == null) return;
  const target = (MAP?.spots ?? []).find(s => String(s.id) === targetId);
  const v = vehicleOf();
  if (Nav.hasArrived(v, target)) {
    PHASE = "ARRIVED";
    document.body.classList.add("arrived");
    showArrived(targetId);
  }
}

function showArrived(id) {
  document.getElementById("toastTxt").textContent = `已到达 ${id} 号车位`;
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(showArrived._t);
  showArrived._t = setTimeout(() => t.classList.remove("show"), 3200);
}

// ============================================================ input
function eventWorld(evt) {
  const r = cv.getBoundingClientRect();
  const sx = (evt.clientX - r.left), sy = (evt.clientY - r.top);
  // The map can be turned, so this has to be the exact inverse of what the renderer applied;
  // otherwise clicking a bay picks whichever one happens to be 90 degrees away.
  const [wx, wy] = Nav.screenToWorld(viewW0, viewH0, cam, cam.rot, sx, sy);
  return { x: wx, y: wy };
}

cv.addEventListener("click", evt => {
  if (!MAP) return;
  const r0 = cv.getBoundingClientRect();
  const cx0 = evt.clientX - r0.left, cy0 = evt.clientY - r0.top;
  if (MINI_RECT && cx0 >= MINI_RECT.x && cx0 <= MINI_RECT.x + MINI_RECT.w
      && cy0 >= MINI_RECT.y && cy0 <= MINI_RECT.y + MINI_RECT.h)
    return;                                  // the overview inset is not a bay
  const w = eventWorld(evt);
  const bay = Nav.bayAt(MAP, w.x, w.y);
  if (!bay) return;
  const st = STATE?.spots?.[String(bay.id)]?.state;
  if (st === "EMPTY") {
    transient(`前往 ${bay.id} 号车位`, "🧭");
    startNavigation(bay.id);
  } else if (st === "OCCUPIED") transient("这个车位有车，选一个绿色空车位", "🚫");
  else transient("现在看不清这个车位，稍等一下", "•");
});

cv.addEventListener("mousemove", evt => {
  if (!MAP) { cv.style.cursor = ""; return; }
  const w = eventWorld(evt);
  const bay = Nav.bayAt(MAP, w.x, w.y);
  cv.style.cursor = bay ? "pointer" : "";
});

document.getElementById("cancelBtn").addEventListener("click", cancelNavigation);

// ============================================================ transient note
let toastTimer = null;
function transient(text, icon) {
  document.getElementById("toastTxt").textContent = text;
  document.querySelector("#toast .big").textContent = icon || "•";
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ============================================================ HUD
function el(id) { return document.getElementById(id); }

// Map the planner's answer to the only two driver-facing transient states. The hero being out of
// view (its own refusal, or no vehicle at all) is "waiting for a fix"; a route that cannot be
// given for any other reason is "finding a new route". The codes are handled here and never shown.
function routeSituation(v, routeDoc) {
  const noFix = !v || v.visible === false || routeDoc?.code === "hero-not-visible";
  if (noFix)
    return { status: "定位等待…", icon: "•", text: "正在重新定位车辆…" };
  if (routeDoc?.ok)
    return { status: "导航中", ...Nav.maneuver(v, routeDoc, NODES) };
  return { status: "重新规划中…", icon: "•", text: "正在重新规划路线…" };
}

// Which sheet is on screen. Choosing happens on the map - the bays are labelled and clickable -
// so this only has to swap the hint for the navigation sheet.
function refreshSheets() {
  if (PHASE === "IDLE") {
    document.body.classList.add("idle");
    document.body.classList.remove("navigating");
  } else {
    document.body.classList.remove("idle");
    if (PHASE === "NAVIGATING") document.body.classList.add("navigating");
  }
}

function updateHud() {
  const v = vehicleOf();
  refreshSheets();
  if (!online) {
    el("statusPill").textContent = "连接断开 · 正在重试…";
    el("title").textContent = "离线";
    el("distV").innerHTML = "–";
    el("subtitle").textContent = "检查 src/main.py 与 src/serve.py 是否在运行";
    return;
  }

  if (PHASE === "IDLE") {
    el("statusPill").textContent = "选择一个空车位开始导航";
    el("arrow").textContent = "•";
    el("maneuverTxt").textContent = "请选择目标车位";
    el("subtitle").textContent = "点下面列表里的空车位";
    el("distV").innerHTML = "–";
    el("targetV").textContent = "–";
    el("title").textContent = "待命";
    return;
  }

  if (PHASE === "ARRIVED") {
    el("statusPill").innerHTML = `已到达 <b>${targetId}</b> 号车位`;
    el("arrow").textContent = "🏁";
    el("maneuverTxt").textContent = "已到达";
    el("subtitle").textContent = `${targetId} 号车位`;
    el("distV").innerHTML = '0<small>m</small>';
    el("targetV").textContent = targetId;
    el("title").textContent = "已到达";
    return;
  }

  // NAVIGATING. The planner may refuse on a given poll - the bay filled, the car left view, no
  // path right now - but none of that is a technical error to a driver: it is either "waiting for
  // a fix" or "working out a new route".
  const sit = routeSituation(v, ROUTE);
  el("statusPill").textContent = sit.status;
  el("arrow").textContent = sit.icon;
  el("maneuverTxt").textContent = sit.text;
  const hidden = !v || v.visible === false;
  const rem = (hidden || !ROUTE?.ok) ? null : Nav.remainingPx(v, ROUTE, NODES);
  el("distV").innerHTML = rem == null ? "–"
    : Nav.formatMetres(rem).replace(" m", "<small>m</small>");
  el("subtitle").textContent = ROUTE?.ok ? "跟随蓝色路线" : "正在重新规划路线…";
  el("targetV").textContent = targetId;
  el("title").textContent = sit.status.replace("…", "");
}

// ============================================================ render
function lerp(a, b, t) { return a + (b - a) * t; }

// Deadband 3 px covers the measured +-2.3 px wander of a parked car; the proportional term keeps a
// moving car in step without ever looking like it is sliding; a jump beyond 60 px is a hand move.
const CAR_DEADBAND_PX = 3.0;
const CAR_FOLLOW_K = 0.45;
const CAR_SNAP_PX = 60.0;

function followAxis(cur, target, deadband, k, snap) {
  const d = target - cur;
  if (Math.abs(d) >= snap) return target;
  if (Math.abs(d) <= deadband) return cur;
  return cur + d * k;
}
function lerpAngle(a, b, t) {
  let d = Nav.normDeg(b - a);
  if (d > 180) d -= 360;
  return Nav.normDeg(a + d * t);
}

// Height of whatever sheet is docked at the bottom right now, so the fitted view avoids it.
function sheetHeight() {
  const nav = document.getElementById("navSheet");
  const pick = document.getElementById("pickSheet");
  const vis = el => el && getComputedStyle(el).display !== "none" ? el.offsetHeight : 0;
  return Math.max(vis(nav), vis(pick));
}

function updateCamera() {
  const worldW = MAP?.coordinate_system?.width ?? 800;
  const worldH = MAP?.coordinate_system?.height ?? 600;
  const v = vehicleOf();
  // Arriving must not yank the view back to the whole lot: the last thing a driver looked at
  // was the bay they were aiming for, so the camera keeps following the stopped car.
  const useFollow = (PHASE === "NAVIGATING" || PHASE === "ARRIVED") &&
                    v && v.visible !== false && car.x != null;
  const sheetInset = sheetHeight();

  // The turn comes first: the route fit below is measured in screen axes, and the rotation is
  // what defines them. Eased along the short way round, so 359 degrees goes forward by two.
  const heading = Nav.carHeading(v);
  const wantRot = (useFollow && heading != null) ? Nav.worldRotation(heading) : 0;
  cam.rot = lerpRad(cam.rot ?? 0, wantRot, 0.12);

  if (useFollow) {
    // Driving: the car is the focal point and sits at the anchor - middle horizontally, a third
    // of the way down - and the zoom is chosen so the whole route still fits around it. No
    // clamping here: it would slide the car off its anchor, which is the one thing this view is
    // for. Some ground outside the lot can show near the edges instead.
    const pts = ROUTE?.ok ? Nav.routePoints(ROUTE, NODES).points : [];
    const [ax, ay] = Nav.navAnchor(viewW0, viewH0, sheetInset, true);
    // Zoomed in, not fitted: a route that does not fit is allowed to leave the screen, because a
    // navigator shows the road ahead rather than the whole trip. The band keeps it a driving view
    // (at least a bit past half the driving zoom) and lets the route fit when it is short enough.
    const drive = driveScale();
    const scale = Nav.routeAroundScale(viewW0, viewH0, ax, ay, cam.rot, car, pts,
                                       56, drive * 0.55, drive, viewH0 - sheetInset);
    targetCam = { scale, cx: car.x, cy: car.y, anchorX: ax, anchorY: ay, inset: sheetInset };
  } else {
    // Nothing selected: the whole parking lot, centred in the part above the sheet.
    const [ax, ay] = Nav.navAnchor(viewW0, viewH0, sheetInset, false);
    const fit = Nav.fitCamera(viewW0, viewH0, worldW, worldH, sheetInset);
    targetCam = { scale: fit.scale, cx: fit.cx, cy: fit.cy, anchorX: ax, anchorY: ay,
                  inset: sheetInset };
  }

  const t = 0.14;
  cam.scale = lerp(cam.scale, targetCam.scale, t);
  // The focal point is taken directly, not eased. Easing it *and* the car marker meant the two
  // drifted apart and then re-converged, which is what "floating" looked like; with the camera
  // pinned to the marker the car sits still and the map moves, as a navigator should.
  cam.cx = targetCam.cx;
  cam.cy = targetCam.cy;
  cam.inset = lerp(cam.inset ?? 0, targetCam.inset ?? 0, t);
  // The anchor is eased because the compositions differ: switching between the lot view and the
  // driving one would otherwise move the map a sixth of the screen in a single frame.
  cam.anchorX = lerp(cam.anchorX ?? targetCam.anchorX, targetCam.anchorX, t);
  cam.anchorY = lerp(cam.anchorY ?? targetCam.anchorY, targetCam.anchorY, t);
}

// Shortest-arc interpolation in radians, for the same reason lerpAngle exists in degrees.
function lerpRad(a, b, t) {
  const two = Math.PI * 2;
  let d = ((b - a + Math.PI) % two + two) % two - Math.PI;
  return a + d * t;
}

let _driveScale = null;
function driveScale() {
  if (_driveScale != null) return _driveScale;
  // Zoom in a fixed amount beyond the fit-to-lot scale, but keep it sane on small windows.
  const fit = Nav.fitCamera(viewW0, viewH0, 800, 600);
  _driveScale = Math.max(fit.scale * 1.7, Math.min(viewW0, viewH0) / 240);
  return _driveScale;
}

// ============================================================ the map style
// A navigation map, not a diagram. The rules, in the order they matter: the ground is flat and
// quiet; the aisle is the *drivable surface*, drawn as a laid-out corridor rather than a grey
// slab (white fill, soft edge, bays sitting on the ground beside it); the route is the brightest
// thing on screen; bay numbers are not drawn while driving - a number per bay is a data label,
// not navigation - and only the destination carries a marker.
const STYLE = {
  ground: "#e9edf1",
  lotEdge: "rgba(15,20,26,.10)",
  aisleFill: "#ffffff",
  aisleEdge: "#dfe4ea",
  aisleWidth: 60,          // world px: the real corridor half-width x2, between the bay rows
  stubWidth: 44,           // world px: the entrance branch
  minLanePx: 60,           // measured: bay access stubs are 27-40 px, real lane runs >= 83 px
  // Bay state colours, the convention every car park uses: free is green, taken is red, and the
  // one being driven to is highlighted yellow. Fills stay light enough to read under the route.
  bayFree: "#dcf3e3",
  bayFreeEdge: "#2f9e5f",
  bayTaken: "#fbe0e0",
  bayTakenEdge: "#d64545",
  bayUnknown: "#eceff3",
  bayUnknownEdge: "#c9d2dc",
  bayTarget: "#fff2c2",
  bayTargetEdge: "#e8a200",
  routeCasing: "rgba(255,255,255,.92)",
  routeFill: "#1f7aff",
  routeWidth: 7,           // screen px
  target: "#ff3b30",
  carBody: ["#ff6a5e", "#e0392f"],
  carGlass: "rgba(255,255,255,.85)",
  labelText: "#33404f",
  plate: "rgba(255,255,255,.85)",
  start: "#8aa0b4",
  showBayNumbers: true,    // every bay carries its number; clicking one picks the target
  labelSize: 13,           // screen px - large enough to read as a number, not as a blob
};

function drawWorld() {
  ctx.clearRect(0, 0, viewW0, viewH0);
  if (!MAP) return;

  ctx.save();
  Nav.applyCamera(ctx, viewW0, viewH0, cam, cam.rot);
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  drawGround();
  drawRoads();                       // the aisle is the surface; bays sit beside it
  for (const s of MAP.spots) drawBayShape(s);
  drawRoute();
  for (const s of MAP.spots) drawBayLabel(s);
  drawTarget();
  drawEntrances();
  if (car.visible && car.x != null) drawCar(car.x, car.y, car.h ?? 0);

  ctx.restore();

  drawMiniMap();
}

// The inset: the whole lot, the whole route, and where the car is in it - the two things the
// zoomed-in view cannot show. No bay colours and no numbers: it is a position, not a dashboard.
let MINI_RECT = null;
function drawMiniMap() {
  const worldW = MAP?.coordinate_system?.width ?? 800;
  const worldH = MAP?.coordinate_system?.height ?? 600;
  const rect = Nav.miniMapRect(viewW0, viewH0, sheetHeight(), worldW, worldH);
  MINI_RECT = rect;
  const t = Nav.miniMapTransform(rect, worldW, worldH);
  const px = x => t.ox + x * t.scale, py = y => t.oy + y * t.scale;

  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  else ctx.rect(rect.x, rect.y, rect.w, rect.h);
  ctx.fillStyle = "rgba(255,255,255,.88)";
  ctx.fill();
  ctx.clip();

  ctx.beginPath();                       // the lot
  ctx.rect(px(0), py(0), worldW * t.scale, worldH * t.scale);
  ctx.fillStyle = "#f2f4f7"; ctx.fill();

  ctx.lineJoin = "round"; ctx.lineCap = "round";
  for (const cyc of LOOPS) {             // the aisles, as lines
    ctx.beginPath();
    cyc.forEach((id, i) => {
      const n = NODES[id];
      return i ? ctx.lineTo(px(n.x), py(n.y)) : ctx.moveTo(px(n.x), py(n.y));
    });
    ctx.closePath();
    ctx.strokeStyle = "#c9d2dc"; ctx.lineWidth = 2.2; ctx.stroke();
  }
  if (ROUTE?.ok) {                       // the whole route, which the main view may crop
    const pts = Nav.routePoints(ROUTE, NODES).points;
    if (pts.length > 1) {
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(px(p[0]), py(p[1])) : ctx.moveTo(px(p[0]), py(p[1])));
      ctx.strokeStyle = STYLE.routeFill; ctx.lineWidth = 2.4; ctx.stroke();
    }
  }
  const target = (MAP.spots ?? []).find(sp => String(sp.id) === targetId);
  if (target) {
    const [tx, ty] = Nav.centroid(target.polygon);
    ctx.beginPath(); ctx.arc(px(tx), py(ty), 3.4, 0, Math.PI * 2);
    ctx.fillStyle = STYLE.bayTargetEdge; ctx.fill();
  }
  if (car.x != null && car.visible) {    // the car, as a little arrow: north-up, so its heading reads
    const hx = (car.h ?? 0) * Math.PI / 180;
    ctx.save();
    ctx.translate(px(car.x), py(car.y));
    ctx.rotate(hx);
    ctx.beginPath();
    ctx.moveTo(0, -5.5); ctx.lineTo(4, 4.5); ctx.lineTo(0, 2.4); ctx.lineTo(-4, 4.5);
    ctx.closePath();
    ctx.fillStyle = STYLE.carBody[1]; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  ctx.beginPath();                       // border last, over the clip
  if (ctx.roundRect) ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  else ctx.rect(rect.x, rect.y, rect.w, rect.h);
  ctx.strokeStyle = "rgba(15,20,26,.18)"; ctx.lineWidth = 1.5; ctx.stroke();
}

const drive = () => PHASE === "NAVIGATING" || PHASE === "ARRIVED";

function drawGround() {
  const w = MAP.coordinate_system?.width ?? 800;
  const h = MAP.coordinate_system?.height ?? 600;
  ctx.fillStyle = STYLE.ground;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = STYLE.lotEdge;
  ctx.lineWidth = 2 / cam.scale;
  ctx.strokeRect(1, 1, w - 2, h - 2);
}

// The aisle: one closed corridor per road loop, plus the entrance branch. Filled in world space
// (it is real geography, so it must scale with the map), with a screen-constant rim so the edge
// stays crisp at any zoom.
function drawRoads() {
  const trace = (pts, closed) => {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    if (closed) ctx.closePath();
  };
  const rim = 1.6 / cam.scale;
  // Butt ends, not round: a round cap on a wide corridor draws a semicircle at every end.
  ctx.lineCap = "butt";
  const band = (pts, closed, half) => {
    trace(pts, closed);
    ctx.strokeStyle = STYLE.aisleEdge; ctx.lineWidth = half * 2 + rim; ctx.stroke();
    trace(pts, closed);
    ctx.strokeStyle = STYLE.aisleFill; ctx.lineWidth = half * 2; ctx.stroke();
  };
  const lengthOf = pts => {
    let L = 0;
    for (let i = 1; i < pts.length; i++)
      L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return L;
  };
  const loopPoints = new Set();
  for (const cyc of LOOPS)
    for (const id of cyc) {
      const n = NODES[id];
      loopPoints.add(Math.round(n.x) + "," + Math.round(n.y));
    }
  for (const cyc of LOOPS) {
    const pts = cyc.map(id => [NODES[id].x, NODES[id].y]);
    if (pts.length >= 3) band(pts, true, STYLE.aisleWidth / 2);
  }
  for (const chain of CHAINS) {
    if (chain.length < 2) continue;
    const onLoop = chain.every(p => loopPoints.has(Math.round(p[0]) + "," + Math.round(p[1])));
    if (onLoop) continue;
    // The map's graph carries one short connector per bay (its access node) so the planner can
    // route into a bay. That is navigation *data*, not a lane: drawn, each became a wide
    // semicircle-tipped stub at every bay. Only real lane runs are drawn here.
    if (lengthOf(chain) < STYLE.minLanePx) continue;
    band(chain, false, STYLE.stubWidth / 2);
  }
}

// The route is drawn last of the lines so nothing crosses over it: white casing under a bright
// fill, screen-constant width, the one thing a driver must be able to follow without looking.
function drawRoute() {
  if (!ROUTE?.ok) return;
  const { points } = Nav.routePoints(ROUTE, NODES);
  if (points.length < 2) return;
  const path = () => {
    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  };
  path(); ctx.strokeStyle = STYLE.routeCasing;
  ctx.lineWidth = (STYLE.routeWidth + 5) / cam.scale; ctx.stroke();
  path(); ctx.strokeStyle = STYLE.routeFill;
  ctx.lineWidth = STYLE.routeWidth / cam.scale; ctx.stroke();
}

// Bays. Paper fills with a faint state tint: they are the background the route runs between, not
// competing colours. While driving they are only a hairline.
function drawBayShape(s) {
  const state = STATE?.spots?.[String(s.id)]?.state ?? "UNKNOWN";
  const isTarget = String(s.id) === targetId;
  const p = s.polygon;
  const poly = () => {
    ctx.beginPath();
    p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
  };
  // The selected bay is yellow; free is green; taken is red. While driving the fills are drawn
  // a little lighter so the route still reads on top, but the state stays legible.
  const alpha = drive() ? 0.55 : 1;
  const paint = (fill, edge, width) => {
    ctx.save(); ctx.globalAlpha = alpha;
    poly(); ctx.fillStyle = fill; ctx.fill();
    poly(); ctx.strokeStyle = edge; ctx.lineWidth = width / cam.scale; ctx.stroke();
    ctx.restore();
  };
  if (isTarget) return paint(STYLE.bayTarget, STYLE.bayTargetEdge, 2.6);
  if (state === "EMPTY") return paint(STYLE.bayFree, STYLE.bayFreeEdge, 1.6);
  if (state === "OCCUPIED") return paint(STYLE.bayTaken, STYLE.bayTakenEdge, 1.6);
  return paint(STYLE.bayUnknown, STYLE.bayUnknownEdge, 1.3);
}

// Numbers are for choosing a bay, not for driving. The pick list carries them; the map does not.
function drawBayLabel(s) {
  if (STYLE.showBayNumbers === false) return;
  const state = STATE?.spots?.[String(s.id)]?.state ?? "UNKNOWN";
  const isTarget = String(s.id) === targetId;
  const [cx, cy] = Nav.centroid(s.polygon);
  const colour = isTarget ? "#8a6100"
    : state === "EMPTY" ? "#1f6b45"
    : state === "OCCUPIED" ? "#9b2c2c" : "#6b7686";
  label(cx, cy, String(s.id), colour, STYLE.labelSize);
}

// The destination, as a map pin - the only place on the map that gets a marker.
function drawTarget() {
  if (targetId == null) return;
  const s = (MAP.spots ?? []).find(sp => String(sp.id) === targetId);
  if (!s) return;
  const [x, y] = Nav.centroid(s.polygon);
  const r = 10 / cam.scale;
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = "rgba(0,0,0,.30)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.beginPath();
  ctx.moveTo(0, r * 1.6);
  ctx.quadraticCurveTo(-r, r * 0.4, -r, 0);
  ctx.arc(0, 0, r, Math.PI, 0);
  ctx.quadraticCurveTo(r, r * 0.4, 0, r * 1.6);
  ctx.closePath();
  ctx.fillStyle = STYLE.bayTargetEdge; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.beginPath(); ctx.arc(0, 0, r * 0.36, 0, Math.PI * 2);
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.restore();
}

// The way in, as a neutral start dot - not a green sign with a caption.
function drawEntrances() {
  for (const g of MAP.entrances ?? []) {
    const n = NODES[g.node];
    if (!n) continue;
    ctx.beginPath(); ctx.arc(n.x, n.y, 7 / cam.scale, 0, Math.PI * 2);
    ctx.fillStyle = STYLE.start; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2 / cam.scale; ctx.stroke();
  }
}

function label(x, y, text, color, size) {
  // Bay numbers stay level while the map turns: a rotated label is unreadable. Screen-sized, on a
  // rounded plate so it stays legible over whatever is under it.
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-(cam.rot || 0));
  const fsPx = (size || 12) / cam.scale;
  ctx.font = `600 ${fsPx}px system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width + 12 / cam.scale, h = fsPx + 8 / cam.scale;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, 5 / cam.scale);
  else ctx.rect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = STYLE.plate; ctx.fill();
  ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  ctx.restore();
}

// The vehicle: a red top-down car, the visual centre of the screen. Screen-constant size (a
// counter-scale undoes the zoom), nose on the heading, so it reads as "my car" not as an arrow.
function drawCar(x, y, heading) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading * Math.PI / 180);
  ctx.scale(1 / cam.scale, 1 / cam.scale);
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 9; ctx.shadowOffsetY = 2;
  const bw = 17, bl = 32, r = 7;
  roundRectPath(-bw / 2, -bl / 2, bw, bl, r);
  const g = ctx.createLinearGradient(0, -bl / 2, 0, bl / 2);
  g.addColorStop(0, STYLE.carBody[0]);
  g.addColorStop(1, STYLE.carBody[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.fillStyle = STYLE.carGlass;
  roundRectPath(-bw / 2 + 3, -bl / 2 + 8, bw - 6, 5, 2); ctx.fill();
  roundRectPath(-bw / 2 + 3, bl / 2 - 10, bw - 6, 4, 2); ctx.fill();
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ============================================================ animation
function tick() {
  // ease the display car towards the last measured pose
  const v = vehicleOf();
  if (v && v.visible !== false && typeof v.x === "number") {
    const th = Nav.carHeading(v);
    if (car.x == null) { car.x = v.x; car.y = v.y; car.h = th ?? 0; }
    else {
      // Measured at rest: the hero fix wanders up to ~2.3 px between updates and the state file is
      // written ~1.3 times a second. A plain lerp turns that into a slow glide - the car looked
      // like it was floating. So: ignore movement inside the measured noise band, and catch up
      // proportionally outside it, snapping when the jump is far too big to be driving.
      car.x = followAxis(car.x, v.x, CAR_DEADBAND_PX, CAR_FOLLOW_K, CAR_SNAP_PX);
      car.y = followAxis(car.y, v.y, CAR_DEADBAND_PX, CAR_FOLLOW_K, CAR_SNAP_PX);
      car.h = lerpAngle(car.h, th ?? car.h, 0.35);
    }
    car.visible = true;
  } else {
    car.visible = false;
  }

  updateCamera();
  drawWorld();
  requestAnimationFrame(tick);
}

// ============================================================ poll
async function loadMap() {
  const doc = await getJSON(DOCS.map);
  if (!doc) return false;
  MAP = doc;
  NODES = Nav.nodesIndex(doc);
  const edges = doc.road_network?.edges ?? [];
  CHAINS = Nav.roadChains(NODES, edges);
  LOOPS = Nav.roadLoops(NODES, edges);
  return true;
}

async function poll() {
  if (!MAP && !(await loadMap())) {
    el("statusPill").textContent = "正在等待地图…";
    return;
  }
  const stateDoc = await getJSON(DOCS.state);
  online = !!stateDoc;
  if (stateDoc) STATE = stateDoc;

  if (online) {
    // Adopt a route written by anyone (plan.py, another tab) the same way board does.
    const fileRoute = await getJSON(DOCS.route);
    if (fileRoute && targetId != null &&
        String(fileRoute.target_spot) === String(targetId) &&
        JSON.stringify(fileRoute) !== JSON.stringify(ROUTE)) {
      ROUTE = fileRoute;
    }
    checkArrival();
    if (PHASE === "NAVIGATING" && shouldReplan(Date.now())) await requestRoute(false);
  }

  updateHud();
}

async function boot() {
  if (!(await loadMap())) {
    el("statusPill").textContent = "正在等待地图…";
    setTimeout(boot, 1000);
    return;
  }
  const stateDoc = await getJSON(DOCS.state);
  if (stateDoc) STATE = stateDoc;
  tick();
  // Self-scheduling rather than setInterval: while the server is down the poll backs off, so a
  // disconnected page does not write a failed request into the console five times a second.
  (async function loop() {
    await poll();
    setTimeout(loop, online ? POLL_MS : 2000);
  })();
  // Deep link: ?spot=10 starts guiding straight to a bay, the same as clicking it.
  const deep = new URLSearchParams(location.search).get("spot");
  if (deep && STATE?.spots?.[deep]?.state === "EMPTY") startNavigation(deep);
}
boot();
</script>
</body>
</html>
