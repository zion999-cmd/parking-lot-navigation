<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>停车场导航</title>
<!--
  The car's view. This page is a pure consumer of the three documents - parking_map.json,
  parking_state.json and the route endpoint - and nothing else. It does not recognise anything,
  it does not plan anything: the perception system says where the car and the free bays are, the
  planner hands back a sequence of node ids, and this page turns those into the picture a driver
  looks at. It is deliberately independent from board.html, which is the expert/perception page;
  board keeps its analysed camera stream, and this page shows no camera at all.

  The adapter between the two layers is the set of small pure functions below (Nav.*): point in
  polygon, metres, the follow camera, turn instruction, arrival. They translate the contract into
  screen terms without changing it, and they are the pieces the tests run in node.
-->
<style>
  :root { color-scheme: dark;
    --bg: #0b0e14; --panel: rgba(15,19,28,.82); --line: rgba(255,255,255,.08);
    --accent: #38bdf8; --green: #34d399; --red: #fb7185; --amber: #fbbf24; --muted: #8b96ab; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: #eef2f8;
         font: 16px/1.45 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  .hud { position: fixed; left: 0; right: 0; z-index: 2; pointer-events: none;
         display: flex; flex-direction: column; align-items: center; padding: 18px 16px; }
  .hud.top { top: 0; gap: 8px; }
  .hud.bottom { bottom: 0; }
  .pill { pointer-events: auto; background: var(--panel); border: 1px solid var(--line);
          border-radius: 999px; padding: 8px 18px; font-size: 15px; letter-spacing: .3px;
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .pill b { color: var(--accent); font-weight: 700; }
  #statusPill { color: var(--muted); }

  .card { pointer-events: auto; width: min(440px, calc(100vw - 32px));
          background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
          padding: 16px 20px 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
          box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .card h1 { margin: 0 0 2px; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .card .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .maneuver { display: flex; align-items: center; gap: 12px; margin: 4px 0 2px; }
  .arrow { font-size: 30px; width: 40px; text-align: center; line-height: 1; }
  .maneuver .txt { font-size: 19px; font-weight: 600; }
  .meta { display: flex; gap: 22px; margin-top: 10px; }
  .meta div { display: flex; flex-direction: column; }
  .meta .k { font-size: 12px; color: var(--muted); }
  .meta .v { font-size: 22px; font-weight: 700; }
  .meta .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer;
           font-weight: 600; color: #06121d; }
  #cancelBtn { background: rgba(255,255,255,.12); color: #eef2f8; flex: 0 0 auto; }
  #againBtn { background: var(--accent); flex: 1; }
  .again-wrap { display: none; }
  body.arrived .again-wrap { display: block; }
  body.arrived .driving-wrap { display: none; }

  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
           z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
           padding: 18px 26px; font-size: 19px; opacity: 0; transition: opacity .25s, transform .25s;
           pointer-events: none; text-align: center; backdrop-filter: blur(12px); }
  #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #toast .big { font-size: 30px; margin-bottom: 4px; }
</style>

<canvas id="map"></canvas>

<div class="hud top">
  <div class="pill" id="statusPill">正在连接…</div>
</div>

<div class="hud bottom">
  <div class="card" id="card">
    <div class="driving-wrap">
      <h1 id="title">停车场导航</h1>
      <div class="sub" id="subtitle">点一个<b style="color:var(--green)">绿色空车位</b>，开始导航</div>
      <div class="maneuver">
        <div class="arrow" id="arrow">•</div>
        <div class="txt" id="maneuverTxt">请选择目标车位</div>
      </div>
      <div class="meta">
        <div><span class="k">剩余</span><span class="v" id="distV">–</span></div>
        <div><span class="k">目标</span><span class="v" id="targetV">–</span></div>
      </div>
      <div class="btns">
        <button id="cancelBtn">结束导航</button>
      </div>
    </div>
    <div class="again-wrap">
      <div class="btns" style="margin-top:0">
        <button id="againBtn">再选一个车位</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"><div class="big">✅</div><div id="toastTxt"></div></div>

<script>
"use strict";

// ============================================================ the adapter
// Pure functions only here: the contract in, screen/driver terms out. No fetch, no canvas, no
// globals, so the tests can lift these straight out and run them in node.
const PX_PER_M = 20.0;        // an 800x600 image_2d lot: measured bays are ~48px wide and a real
                              // bay is ~2.4m across, so 1 metre is about 20 image pixels.

const Nav = {
  // ---- geometry ---------------------------------------------------------
  pointInPoly(x, y, poly) {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) hit = !hit;
    }
    return hit;
  },
  centroid(poly) {
    let x = 0, y = 0;
    for (const [px, py] of poly) { x += px; y += py; }
    return [x / poly.length, y / poly.length];
  },
  bayAt(mapDoc, x, y) {
    return (mapDoc?.spots ?? []).find(s => this.pointInPoly(x, y, s.polygon)) ?? null;
  },
  nodesIndex(mapDoc) {
    const out = {};
    for (const n of mapDoc?.road_network?.nodes ?? []) out[n.id] = n;
    return out;
  },
  // The route is node ids; resolve them against the map into world points, dropping any id the
  // map no longer has (it can briefly lag an edit) rather than drawing a broken line.
  routePoints(routeDoc, nodes) {
    const ids = (routeDoc?.ok && routeDoc.nodes) || [];
    const points = [];
    let unknown = 0;
    for (const id of ids) {
      if (nodes[id]) points.push([nodes[id].x, nodes[id].y]);
      else unknown += 1;
    }
    return { points, unknown };
  },

  // ---- units ------------------------------------------------------------
  metres(px) { return px / PX_PER_M; },
  formatMetres(px) {
    if (px == null || !isFinite(px)) return "–";
    const m = px / PX_PER_M;
    return m >= 100 ? `${Math.round(m)} m` : `${m.toFixed(1)} m`;
  },

  // ---- angles -----------------------------------------------------------
  // The contract measures angles in image coordinates: 0 along +x (right), increasing towards
  // +y (down). That is the same convention canvas rotate() uses, so a car drawn pointing "up"
  // its own local -y rotates correctly by the heading with no axis swap.
  normDeg(a) { return ((a % 360) + 360) % 360; },
  // Signed turn from one bearing to another in -180..180, along the short way.
  turnDeg(from, to) {
    let d = this.normDeg(to - from);
    if (d > 180) d -= 360;
    return d;
  },
  bearing(ax, ay, bx, by) { return this.normDeg(Math.atan2(by - ay, bx - ax) * 180 / Math.PI); },

  // Two angle frames meet here and they must not be mixed. The *map/route* lives in image
  // coordinates: 0 along +x (right), increasing clockwise because +y points down. A *driver*
  // thinks in compass/screen terms: 0 pointing up, increasing clockwise. Comparing one against
  // the other directly mirrors every left/right, so route directions are converted out of the
  // image frame before any maneuver is decided. Pure: image bearing in, driver bearing out.
  imageToDriverDeg(imageDeg) {
    // image 0 (right) is driver 90; image 90 (down) is driver 180.
    return this.normDeg(imageDeg + 90);
  },
  driverBearing(ax, ay, bx, by) {
    return this.imageToDriverDeg(this.bearing(ax, ay, bx, by));
  },
  // Which way to point the car. front_heading already resolves front from back and is reported
  // in driver/screen terms (0 = up, clockwise); the bare heading is only the 0..180 image axis
  // and must not be used to rotate the icon on its own. The icon is drawn north-up and rotated
  // by this driver angle in the renderer.
  carHeading(vehicle) {
    if (!vehicle) return null;
    if (vehicle.front_is_known && typeof vehicle.front_heading === "number")
      return vehicle.front_heading;
    if (typeof vehicle.heading === "number") return this.imageToDriverDeg(vehicle.heading);
    return null;
  },

  // ---- remaining distance ----------------------------------------------
  // Sum the route from the node nearest the car to the end, plus the car's gap to that node.
  // This is the number that visibly counts down; planning itself is unchanged upstream.
  remainingPx(vehicle, routeDoc, nodes) {
    const { points } = this.routePoints(routeDoc, nodes);
    if (!points.length) return null;
    if (!vehicle || typeof vehicle.x !== "number") return routeDoc.distance ?? null;
    let best = 0, bestD = Infinity;
    for (let i = 0; i < points.length; i++) {
      const d = Math.hypot(points[i][0] - vehicle.x, points[i][1] - vehicle.y);
      if (d < bestD) { bestD = d; best = i; }
    }
    let total = bestD;
    for (let i = best; i < points.length - 1; i++)
      total += Math.hypot(points[i + 1][0] - points[i][0], points[i + 1][1] - points[i][1]);
    return total;
  },

  // ---- the next maneuver ------------------------------------------------
  // A driving instruction, not a graph fact: compare the route's upcoming bearing with the way
  // the car is facing and say it in the driver's frame.
  maneuver(vehicle, routeDoc, nodes) {
    const { points } = this.routePoints(routeDoc, nodes);
    if (points.length < 2) return { icon: "•", text: "即将到达" };
    if (!vehicle) return { icon: "•", text: "正在重新规划路线…" };
    const heading = this.carHeading(vehicle);
    // Find the first route point ahead of the car.
    let k = 0, bestD = Infinity;
    for (let i = 0; i < points.length; i++) {
      const d = Math.hypot(points[i][0] - vehicle.x, points[i][1] - vehicle.y);
      if (d < bestD) { bestD = d; k = i; }
    }
    if (k >= points.length - 1) return { icon: "🏁", text: "即将到达" };
    const bear = this.driverBearing(points[k][0], points[k][1], points[k + 1][0], points[k + 1][1]);
    const rel = heading == null ? 0 : this.turnDeg(heading, bear);
    const segLen = Math.hypot(points[k + 1][0] - points[k][0], points[k + 1][1] - points[k][1]);
    const far = this.formatMetres(segLen);
    if (Math.abs(rel) <= 22) return { icon: "⬆️", text: `沿通道直行（约 ${far}）` };
    if (rel > 22 && rel <= 60) return { icon: "↗️", text: `前方靠右前行（约 ${far}）` };
    if (rel < -22 && rel >= -60) return { icon: "↖️", text: `前方靠左前行（约 ${far}）` };
    if (rel > 60 && rel <= 150) return { icon: "➡️", text: `前方右转（约 ${far}）` };
    if (rel < -60 && rel >= -150) return { icon: "⬅️", text: `前方左转（约 ${far}）` };
    return { icon: "↩️", text: "前方掉头" };
  },

  // ---- arrival ----------------------------------------------------------
  hasArrived(vehicle, target) {
    if (!vehicle || !target) return false;
    if (typeof vehicle.x !== "number" || typeof vehicle.y !== "number") return false;
    return this.pointInPoly(vehicle.x, vehicle.y, target.polygon);
  },

  // ---- the follow camera ------------------------------------------------
  // World->screen: uniform scale, then centred on a focal point. In IDLE the whole lot is
  // framed; while navigating the focal point is the car, so the lot slides past it. Pure.
  fitCamera(viewW, viewH, worldW, worldH) {
    const pad = 48;
    const scale = Math.min((viewW - pad * 2) / worldW, (viewH - pad * 2) / worldH);
    return { scale, cx: worldW / 2, cy: worldH / 2 };
  },
  followCamera(viewW, viewH, x, y, scale) {
    return { scale, cx: x, cy: y };
  },
  // Keep the view inside the lot. Following a car that parks in a corner would otherwise put a
  // third of the screen on ground that is not a car park at all; a real navigator slides the map
  // so the edge stops at the screen edge and the car drifts off centre instead. If the lot is
  // smaller than the view it is simply centred.
  clampCamera(viewW, viewH, cam, worldW, worldH) {
    const halfW = viewW / 2 / cam.scale, halfH = viewH / 2 / cam.scale;
    const cx = (worldW <= halfW * 2) ? worldW / 2
               : Math.min(Math.max(cam.cx, halfW), worldW - halfW);
    const cy = (worldH <= halfH * 2) ? worldH / 2
               : Math.min(Math.max(cam.cy, halfH), worldH - halfH);
    return { scale: cam.scale, cx, cy };
  },
  toScreen(viewW, viewH, cam, wx, wy) {
    return [viewW / 2 + (wx - cam.cx) * cam.scale,
            viewH / 2 + (wy - cam.cy) * cam.scale];
  },
};

let viewW0 = 0, viewH0 = 0;

// ============================================================ state
const DOCS = { map: "../out/parking_map.json", state: "../out/parking_state.json",
               route: "../out/route.json" };
const POLL_MS = 250;
const REPLAN_MOVE_PX = 4;
const REPLAN_AFTER_MS = 1500;

let MAP = null, NODES = {}, STATE = null, ROUTE = null;
let PHASE = "IDLE";            // IDLE | NAVIGATING | ARRIVED
let targetId = null;
let lastPlan = { x: null, y: null, at: 0 };
let replanSeq = 0;
let waitingNote = 0;

// The smoothly animated car: we render every frame and lerp this display pose towards the last
// reported pose, so the icon glides instead of jumping on each 250 ms poll.
const car = { x: null, y: null, h: null, visible: false };
let cam = { scale: 1, cx: 400, cy: 300 };
let targetCam = null;

const cv = document.getElementById("map");
const ctx = cv.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  viewW0 = window.innerWidth; viewH0 = window.innerHeight;
  cv.width = Math.round(viewW0 * DPR);
  cv.height = Math.round(viewH0 * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

async function getJSON(url) {
  try {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

const vehicleOf = () => STATE?.vehicle ?? null;

// ============================================================ planning
async function startNavigation(id) {
  targetId = String(id);
  PHASE = "NAVIGATING";
  document.body.classList.remove("arrived");
  lastPlan = { x: null, y: null, at: 0 };
  await requestRoute(true);
  updateHud();
}

async function requestRoute(manual) {
  const mine = ++replanSeq;
  let doc = null;
  try {
    const r = await fetch(`/api/route?spot=${encodeURIComponent(targetId)}&t=${Date.now()}`);
    doc = await r.json();
  } catch (e) {
    doc = null;
  }
  if (mine !== replanSeq) return;
  if (doc) {
    ROUTE = doc;
    const v = vehicleOf();
    lastPlan = { x: v?.x ?? null, y: v?.y ?? null, at: Date.now() };
  } else if (manual) {
    transient("正在连接导航服务…", "•");
  }
}

// When to ask for a new route. Same policy as board.html, deliberately: moving is the trigger while
// the car is visible, and the timer is the safety net that still fires when it is not - a bay can
// be taken by someone else while the hero is hidden, and that has to be noticed.
function shouldReplan(now) {
  if (PHASE !== "NAVIGATING" || targetId == null) return false;
  if (!lastPlan || lastPlan.at == null) return true;              // nothing planned yet
  if (now - lastPlan.at >= REPLAN_AFTER_MS) return true;          // the parked safety net
  const v = vehicleOf();
  if (!v || v.visible === false) return false;                    // no fix: nothing to compare against
  if (typeof v.x !== "number" || typeof v.y !== "number") return false;
  if (lastPlan.x == null || lastPlan.y == null) return true;      // a fix appeared where there was none
  return Math.hypot(v.x - lastPlan.x, v.y - lastPlan.y) >= REPLAN_MOVE_PX;
}

function cancelNavigation() {
  PHASE = "IDLE"; targetId = null; ROUTE = null;
  document.body.classList.remove("arrived");
  updateHud();
}

// ============================================================ arrival
function checkArrival() {
  if (PHASE !== "NAVIGATING" || targetId == null) return;
  const target = (MAP?.spots ?? []).find(s => String(s.id) === targetId);
  const v = vehicleOf();
  if (Nav.hasArrived(v, target)) {
    PHASE = "ARRIVED";
    document.body.classList.add("arrived");
    showArrived(targetId);
  }
}

function showArrived(id) {
  document.getElementById("toastTxt").textContent = `已到达 ${id} 号车位`;
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(showArrived._t);
  showArrived._t = setTimeout(() => t.classList.remove("show"), 3200);
}

// ============================================================ input
function eventWorld(evt) {
  const r = cv.getBoundingClientRect();
  const sx = (evt.clientX - r.left), sy = (evt.clientY - r.top);
  return {
    x: cam.cx + (sx - viewW0 / 2) / cam.scale,
    y: cam.cy + (sy - viewH0 / 2) / cam.scale,
  };
}

cv.addEventListener("click", evt => {
  if (PHASE === "NAVIGATING" || PHASE === "ARRIVED") return;
  if (!MAP) return;
  const w = eventWorld(evt);
  const bay = Nav.bayAt(MAP, w.x, w.y);
  if (!bay) return;
  const st = STATE?.spots?.[String(bay.id)]?.state;
  if (st === "EMPTY") startNavigation(bay.id);
  else if (st === "OCCUPIED") transient("这个车位有车，选一个绿色空车位", "🚫");
  else transient("现在看不清这个车位，稍等一下", "•");
});

cv.addEventListener("mousemove", evt => {
  if (PHASE !== "IDLE" || !MAP) { cv.style.cursor = ""; return; }
  const w = eventWorld(evt);
  const bay = Nav.bayAt(MAP, w.x, w.y);
  cv.style.cursor = bay ? "pointer" : "";
});

document.getElementById("cancelBtn").addEventListener("click", cancelNavigation);
document.getElementById("againBtn").addEventListener("click", cancelNavigation);

// ============================================================ transient note
let toastTimer = null;
function transient(text, icon) {
  document.getElementById("toastTxt").textContent = text;
  document.querySelector("#toast .big").textContent = icon || "•";
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ============================================================ HUD
function el(id) { return document.getElementById(id); }

// Map the planner's answer to the only two driver-facing transient states. The hero being out of
// view (its own refusal, or no vehicle at all) is "waiting for a fix"; a route that cannot be
// given for any other reason is "finding a new route". The codes are handled here and never shown.
function routeSituation(v, routeDoc) {
  const noFix = !v || v.visible === false || routeDoc?.code === "hero-not-visible";
  if (noFix)
    return { status: "定位等待…", icon: "•", text: "正在重新定位车辆…" };
  if (routeDoc?.ok)
    return { status: "导航中", ...Nav.maneuver(v, routeDoc, NODES) };
  return { status: "重新规划中…", icon: "•", text: "正在重新规划路线…" };
}

function updateHud() {
  const v = vehicleOf();

  if (PHASE === "IDLE") {
    el("statusPill").innerHTML = "停车场导航";
    el("title").textContent = "选择一个空车位";
    el("subtitle").innerHTML = '点一个<b style="color:var(--green)">绿色空车位</b>，开始导航';
    el("arrow").textContent = "•";
    el("maneuverTxt").textContent = "请选择目标车位";
    el("distV").innerHTML = "–";
    el("targetV").innerHTML = "–";
    return;
  }

  if (PHASE === "ARRIVED") {
    el("statusPill").innerHTML = `已到达 <b>${targetId}</b> 号车位`;
    el("title").textContent = "已到达";
    el("arrow").textContent = "✅";
    el("maneuverTxt").textContent = `${targetId} 号车位`;
    el("distV").innerHTML = "0<small>m</small>";
    el("targetV").innerHTML = `${targetId}<small>号</small>`;
    return;
  }

  // NAVIGATING. The planner may refuse on a given poll - the bay filled, the car left view, no
  // path right now - but none of that is a technical error to a driver: it is either "waiting for
  // a fix" or "working out a new route". routeSituation maps the planner's codes to those two.
  const hidden = !v || v.visible === false;
  const sit = routeSituation(v, ROUTE);
  el("statusPill").textContent = sit.status;
  el("arrow").textContent = sit.icon;
  el("maneuverTxt").textContent = sit.text;
  const rem = (hidden || !ROUTE?.ok) ? null : Nav.remainingPx(v, ROUTE, NODES);
  el("distV").innerHTML = rem == null ? "–" : Nav.formatMetres(rem).replace(" m", "<small>m</small>");
  el("targetV").innerHTML = `${targetId}<small>号</small>`;
}

// ============================================================ render
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngle(a, b, t) {
  let d = Nav.normDeg(b - a);
  if (d > 180) d -= 360;
  return Nav.normDeg(a + d * t);
}

function updateCamera() {
  const worldW = MAP?.coordinate_system?.width ?? 800;
  const worldH = MAP?.coordinate_system?.height ?? 600;
  const v = vehicleOf();
  // Arriving must not yank the view back to the whole lot: the last thing a driver looked at
  // was the bay they were aiming for, so the camera keeps following the stopped car.
  const useFollow = (PHASE === "NAVIGATING" || PHASE === "ARRIVED") &&
                    v && v.visible !== false && car.x != null;
  if (useFollow) targetCam = Nav.followCamera(viewW0, viewH0, car.x, car.y, driveScale());
  else {
    const fit = Nav.fitCamera(viewW0, viewH0, worldW, worldH);
    targetCam = fit;
  }
  const t = 0.14;
  cam.scale = lerp(cam.scale, targetCam.scale, t);
  cam.cx = lerp(cam.cx, targetCam.cx, t);
  cam.cy = lerp(cam.cy, targetCam.cy, t);
  if (useFollow) cam = Nav.clampCamera(viewW0, viewH0, cam, worldW, worldH);
}

let _driveScale = null;
function driveScale() {
  if (_driveScale != null) return _driveScale;
  // Zoom in a fixed amount beyond the fit-to-lot scale, but keep it sane on small windows.
  const fit = Nav.fitCamera(viewW0, viewH0, 800, 600);
  _driveScale = Math.max(fit.scale * 1.7, Math.min(viewW0, viewH0) / 240);
  return _driveScale;
}

function drawWorld() {
  ctx.clearRect(0, 0, viewW0, viewH0);
  if (!MAP) return;

  ctx.save();
  ctx.translate(viewW0 / 2, viewH0 / 2);
  ctx.scale(cam.scale, cam.scale);
  ctx.translate(-cam.cx, -cam.cy);

  // ground
  ctx.fillStyle = "#11151f";
  ctx.fillRect(0, 0, 800, 600);

  // roads first (under the bays): stroke every graph edge as a lane band.
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const e of MAP.road_network?.edges ?? []) {
    const a = NODES[e.from], b = NODES[e.to];
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "#232a38"; ctx.lineWidth = 26; ctx.stroke();
    ctx.strokeStyle = "#2b3344"; ctx.lineWidth = 22; ctx.stroke();
  }
  // centre dashes on the lanes
  ctx.setLineDash([10, 10]);
  for (const e of MAP.road_network?.edges ?? []) {
    const a = NODES[e.from], b = NODES[e.to];
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.setLineDash([]);

  // entrance marker
  for (const g of MAP.entrances ?? []) {
    const n = NODES[g.node];
    if (!n) continue;
    ctx.beginPath(); ctx.arc(n.x, n.y, 12, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(56,189,248,.25)"; ctx.fill();
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.stroke();
    label(n.x + 16, n.y + 4, "入口", "#7dd3fc", 13);
  }

  // bays
  for (const s of MAP.spots) {
    const state = STATE?.spots?.[String(s.id)]?.state ?? "UNKNOWN";
    const isTarget = String(s.id) === targetId;
    drawBay(s, state, isTarget);
  }

  // route highlight
  if (ROUTE?.ok) {
    const { points } = Nav.routePoints(ROUTE, NODES);
    if (points.length > 1) {
      ctx.beginPath();
      points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 7; ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(56,189,248,.6)"; ctx.shadowBlur = 12; ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // the car
  if (car.visible && car.x != null) drawCar(car.x, car.y, car.h ?? 0);

  ctx.restore();
}

function drawBay(s, state, isTarget) {
  const p = s.polygon;
  ctx.beginPath();
  p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();

  let fill = "rgba(255,255,255,.03)", stroke = "rgba(255,255,255,.14)";
  if (state === "EMPTY") { fill = "rgba(52,211,153,.13)"; stroke = "rgba(52,211,153,.55)"; }
  else if (state === "OCCUPIED") { fill = "rgba(251,113,133,.12)"; stroke = "rgba(251,113,133,.5)"; }
  else { fill = "rgba(139,150,171,.10)"; stroke = "rgba(139,150,171,.4)"; }
  if (isTarget) { fill = "rgba(56,189,248,.20)"; stroke = "#38bdf8"; }

  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = isTarget ? 3 : 1.5; ctx.stroke();

  // Only label bays when zoomed out enough to read; while driving the labels would clutter.
  if (cam.scale < driveScale() * 0.85) {
    const [cx, cy] = Nav.centroid(p);
    label(cx, cy + 4, String(s.id),
          state === "EMPTY" ? "#86efac" : state === "OCCUPIED" ? "#fda4af" : "#aeb8c8", 12);
  } else if (isTarget) {
    const [cx, cy] = Nav.centroid(p);
    label(cx, cy + 4, String(s.id), "#7dd3fc", 13);
  }
}

function label(x, y, text, color, size) {
  ctx.font = `600 ${size || 12}px system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(8,11,17,.8)";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

// The nose sits on the local +x axis and the body runs back along -x. Rotating the context by
// the heading then points the nose exactly at the heading because image angles and canvas
// rotation share one convention (0 = +x, increasing towards +y).
function drawCar(x, y, heading) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading * Math.PI / 180);

  ctx.beginPath();
  ctx.moveTo(0, -15);                      // nose (up)
  ctx.lineTo(9, -6); ctx.lineTo(8, 11); ctx.lineTo(0, 13);
  ctx.lineTo(-8, 11); ctx.lineTo(-9, -6);
  ctx.closePath();
  ctx.fillStyle = "#ef4444";
  ctx.shadowColor = "rgba(239,68,68,.7)"; ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.5; ctx.stroke();
  // windscreen cue near the nose, so the front reads even in silhouette
  ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(0, -8); ctx.lineTo(6, -4);
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
}

// ============================================================ animation
function tick() {
  // ease the display car towards the last measured pose
  const v = vehicleOf();
  if (v && v.visible !== false && typeof v.x === "number") {
    const th = Nav.carHeading(v);
    if (car.x == null) { car.x = v.x; car.y = v.y; car.h = th ?? 0; }
    else {
      car.x = lerp(car.x, v.x, 0.22);
      car.y = lerp(car.y, v.y, 0.22);
      car.h = lerpAngle(car.h, th ?? car.h, 0.22);
    }
    car.visible = true;
  } else {
    car.visible = false;
  }

  updateCamera();
  drawWorld();
  requestAnimationFrame(tick);
}

// ============================================================ poll
async function loadMap() {
  const doc = await getJSON(DOCS.map);
  if (!doc) return false;
  MAP = doc;
  NODES = Nav.nodesIndex(doc);
  return true;
}

async function poll() {
  if (!MAP && !(await loadMap())) {
    el("statusPill").textContent = "正在等待地图…";
    return;
  }
  const stateDoc = await getJSON(DOCS.state);
  if (stateDoc) STATE = stateDoc;

  // Adopt a route written by anyone (plan.py, another tab) the same way board does.
  const fileRoute = await getJSON(DOCS.route);
  if (fileRoute && targetId != null &&
      String(fileRoute.target_spot) === String(targetId) &&
      JSON.stringify(fileRoute) !== JSON.stringify(ROUTE)) {
    ROUTE = fileRoute;
  }

  checkArrival();
  if (PHASE === "NAVIGATING" && shouldReplan(Date.now())) await requestRoute(false);

  updateHud();
}

async function boot() {
  if (!(await loadMap())) {
    el("statusPill").textContent = "正在等待地图…";
    setTimeout(boot, 1000);
    return;
  }
  const stateDoc = await getJSON(DOCS.state);
  if (stateDoc) STATE = stateDoc;
  tick();
  poll();
  setInterval(poll, POLL_MS);
  // Deep link: ?spot=10 starts guiding straight to a bay, the same as clicking it.
  const deep = new URLSearchParams(location.search).get("spot");
  if (deep && STATE?.spots?.[deep]?.state === "EMPTY") startNavigation(deep);
}
boot();
</script>
</body>
</html>
