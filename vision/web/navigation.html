<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>停车场导航</title>
<!--
  The car's view. This page is a pure consumer of the three documents - parking_map.json,
  parking_state.json and the route endpoint - and nothing else. It does not recognise anything,
  it does not plan anything: the perception system says where the car and the free bays are, the
  planner hands back a sequence of node ids, and this page turns those into the picture a driver
  looks at. It is deliberately independent from board.html, which is the expert/perception page;
  board keeps its analysed camera stream, and this page shows no camera at all.

  The adapter between the two layers is the set of small pure functions below (Nav.*): point in
  polygon, metres, the follow camera, turn instruction, arrival. They translate the contract into
  screen terms without changing it, and they are the pieces the tests run in node.
-->
<style>
  :root { color-scheme: dark;
    --bg: #0b0e14; --panel: rgba(15,19,28,.82); --line: rgba(255,255,255,.08);
    --accent: #38bdf8; --green: #34d399; --red: #fb7185; --amber: #fbbf24; --muted: #8b96ab; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: #eef2f8;
         font: 16px/1.45 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  .hud { position: fixed; left: 0; right: 0; z-index: 2; pointer-events: none;
         display: flex; flex-direction: column; align-items: center; padding: 18px 16px; }
  .hud.top { top: 0; gap: 8px; }
  .hud.bottom { bottom: 0; }
  .pill { pointer-events: auto; background: var(--panel); border: 1px solid var(--line);
          border-radius: 999px; padding: 8px 18px; font-size: 15px; letter-spacing: .3px;
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .pill b { color: var(--accent); font-weight: 700; }
  #statusPill { color: var(--muted); }

  .card { pointer-events: auto; width: min(440px, calc(100vw - 32px));
          background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
          padding: 16px 20px 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
          box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .card h1 { margin: 0 0 2px; font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .card .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .maneuver { display: flex; align-items: center; gap: 12px; margin: 4px 0 2px; }
  .arrow { font-size: 30px; width: 40px; text-align: center; line-height: 1; }
  .maneuver .txt { font-size: 19px; font-weight: 600; }
  .meta { display: flex; gap: 22px; margin-top: 10px; }
  .meta div { display: flex; flex-direction: column; }
  .meta .k { font-size: 12px; color: var(--muted); }
  .meta .v { font-size: 22px; font-weight: 700; }
  .meta .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer;
           font-weight: 600; color: #06121d; }
  #cancelBtn { background: rgba(255,255,255,.12); color: #eef2f8; flex: 0 0 auto; }
  #againBtn { background: var(--accent); flex: 1; }
  .again-wrap { display: none; }
  body.arrived .again-wrap { display: block; }
  body.arrived .driving-wrap { display: none; }

  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
           z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
           padding: 18px 26px; font-size: 19px; opacity: 0; transition: opacity .25s, transform .25s;
           pointer-events: none; text-align: center; backdrop-filter: blur(12px); }
  #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  #toast .big { font-size: 30px; margin-bottom: 4px; }

  /* The chrome follows the map: a light map inside a dark frame looks like a mistake. The three
     styles set the same variables the panels already use, so nothing else has to know. */
  :root[data-style="real"], :root[data-style="day"] { --bg: #f1efe9; --panel: rgba(255,255,255,.88);
    --line: rgba(0,0,0,.12); --muted: #5f6368; --accent: #1a73e8; --green: #137333;
    color-scheme: light; }
  :root[data-style="real"] body, :root[data-style="day"] body { color: #202124; }
  :root[data-style="real"] #cancelBtn, :root[data-style="day"] #cancelBtn { background: rgba(0,0,0,.08); color: #202124; }
  :root[data-style="day"] #againBtn { color: #ffffff; }
  :root[data-style="indoor"] { --bg: #2b2e33; --panel: rgba(24,26,30,.88);
    --line: rgba(255,255,255,.12); --accent: #ffd60a; --green: #ffd60a; }
  :root[data-style="indoor"] #againBtn { background: #ffd60a; color: #21232a; }
</style>

<script>
"use strict";

// ============================================================ the adapter
// Pure functions only here: the contract in, screen/driver terms out. No fetch, no canvas, no
// globals, so the tests can lift these straight out and run them in node.
const PX_PER_M = 20.0;        // an 800x600 image_2d lot: measured bays are ~48px wide and a real
                              // bay is ~2.4m across, so 1 metre is about 20 image pixels.

const Nav = {
  // ---- geometry ---------------------------------------------------------
  pointInPoly(x, y, poly) {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) hit = !hit;
    }
    return hit;
  },
  centroid(poly) {
    let x = 0, y = 0;
    for (const [px, py] of poly) { x += px; y += py; }
    return [x / poly.length, y / poly.length];
  },
  bayAt(mapDoc, x, y) {
    return (mapDoc?.spots ?? []).find(s => this.pointInPoly(x, y, s.polygon)) ?? null;
  },
  nodesIndex(mapDoc) {
    const out = {};
    for (const n of mapDoc?.road_network?.nodes ?? []) out[n.id] = n;
    return out;
  },
  // The route is node ids; resolve them against the map into world points, dropping any id the
  // map no longer has (it can briefly lag an edit) rather than drawing a broken line.
  routePoints(routeDoc, nodes) {
    const ids = (routeDoc?.ok && routeDoc.nodes) || [];
    const points = [];
    let unknown = 0;
    for (const id of ids) {
      if (nodes[id]) points.push([nodes[id].x, nodes[id].y]);
      else unknown += 1;
    }
    return { points, unknown };
  },

  // ---- the road, as continuous lines --------------------------------------
  // Edges are how the map is stored, not how a road looks. Drawn edge by edge, a road made of
  // four stored segments reads as four segments: the lane band shows its seams and the centre
  // dashes restart at every node. Chains merge runs of edges through nodes that are merely
  // somewhere along the road (degree 2) and stop where the road really branches.
  roadChains(nodes, edges) {
    const adj = {};
    const add = (a, b) => { (adj[a] = adj[a] || []).push(b); };
    for (const e of edges) {
      if (!nodes[e.from] || !nodes[e.to]) continue;
      add(e.from, e.to); add(e.to, e.from);
    }
    const degree = id => (adj[id] || []).length;
    const used = new Set();
    const key = (a, b) => a < b ? a + "|" + b : b + "|" + a;
    const chains = [];
    // Carry on through a junction when one way out is plainly the same road continuing. This is
    // the case that matters here: every bay's entrance is a branch off a lane, so a lane has a
    // junction at every bay, and stopping at each of them is what made one road look like forty
    // short ones. The branch is left for its own chain.
    const STRAIGHT_TOL = 50 * Math.PI / 180;
    const walk = (start, next) => {
      const ids = [start, next];
      used.add(key(start, next));
      let prev = start, cur = next;
      for (;;) {
        const options = (adj[cur] || []).filter(id => id !== prev && !used.has(key(cur, id)));
        if (!options.length) break;
        let onward = null;
        if (degree(cur) === 2) {
          onward = options[0];                       // nothing to choose: the road goes on
        } else {
          const into = this.bearing(nodes[prev].x, nodes[prev].y, nodes[cur].x, nodes[cur].y);
          let best = Infinity;
          for (const id of options) {
            const out = this.bearing(nodes[cur].x, nodes[cur].y, nodes[id].x, nodes[id].y);
            const turn = Math.abs(this.turnDeg(into, out));
            if (turn < best) { best = turn; onward = id; }
          }
          if (best > STRAIGHT_TOL * 180 / Math.PI) onward = null;
        }
        if (onward == null) break;
        used.add(key(cur, onward));
        ids.push(onward);
        prev = cur; cur = onward;
      }
      chains.push(ids.map(id => [nodes[id].x, nodes[id].y]));
    };
    // Start at the ends and the junctions first, so a road is traced through from one end to the
    // other rather than in pieces from whatever node happened to come first.
    for (const id of Object.keys(adj)) {
      if (degree(id) === 2) continue;
      for (const other of adj[id]) if (!used.has(key(id, other))) walk(id, other);
    }
    // What is left is loops, which have no end to start from.
    for (const e of edges) {
      if (!nodes[e.from] || !nodes[e.to]) continue;
      if (!used.has(key(e.from, e.to))) walk(e.from, e.to);
    }
    return chains;
  },

  // Closed loops in the road graph, as ordered node ids. A ring drawn edge by edge reads as
  // segments; a loop is one closed path with no end caps, so it is found and drawn once.
  roadLoops(nodes, edges) {
    // 2-core: peel degree-1 nodes (the entrance stub) until only cycle edges remain, then walk
    // each cycle once. A DFS back-edge scan missed this ring entirely; leaf pruning cannot.
    const adj = {};
    for (const e of edges) {
      if (!nodes[e.from] || !nodes[e.to]) continue;
      (adj[e.from] ?? (adj[e.from] = [])).push(e.to);
      (adj[e.to] ?? (adj[e.to] = [])).push(e.from);
    }
    const deg = Object.fromEntries(Object.keys(adj).map(k => [k, adj[k].length]));
    const removed = new Set();
    const leaf = Object.keys(deg).filter(k => deg[k] === 1);
    while (leaf.length) {
      const cur = leaf.pop();
      if (removed.has(cur) || deg[cur] !== 1) continue;
      removed.add(cur);
      for (const nb of adj[cur]) {
        if (removed.has(nb)) continue;
        deg[nb] -= 1;
        if (deg[nb] === 1) leaf.push(nb);
      }
    }
    const onCycle = id => !removed.has(id) && deg[id] >= 2;
    const cycAdj = {};
    for (const id of Object.keys(adj))
      if (onCycle(id)) cycAdj[id] = adj[id].filter(onCycle);

    const loops = [];
    const used = new Set();
    const ekey = (a, b) => a < b ? a + "|" + b : b + "|" + a;
    for (const start of Object.keys(cycAdj)) {
      if (cycAdj[start].every(nb => used.has(ekey(start, nb)))) continue;
      const ring = [start];
      let prev = null, cur = start;
      for (;;) {
        let nxt = null;
        for (const nb of cycAdj[cur])
          if (nb !== prev && !used.has(ekey(cur, nb))) { nxt = nb; break; }
        if (nxt == null || nxt === start) {
          if (nxt === start) { used.add(ekey(cur, start)); ring.push(start); }
          break;
        }
        used.add(ekey(cur, nxt));
        ring.push(nxt);
        prev = cur; cur = nxt;
      }
      if (ring.length >= 4) loops.push(ring);
    }
    return loops;
  },

  // ---- units ------------------------------------------------------------
  metres(px) { return px / PX_PER_M; },
  formatMetres(px) {
    if (px == null || !isFinite(px)) return "–";
    const m = px / PX_PER_M;
    return m >= 100 ? `${Math.round(m)} m` : `${m.toFixed(1)} m`;
  },

  // ---- angles -----------------------------------------------------------
  // The contract measures angles in image coordinates: 0 along +x (right), increasing towards
  // +y (down). That is the same convention canvas rotate() uses, so a car drawn pointing "up"
  // its own local -y rotates correctly by the heading with no axis swap.
  normDeg(a) { return ((a % 360) + 360) % 360; },
  // Signed turn from one bearing to another in -180..180, along the short way.
  turnDeg(from, to) {
    let d = this.normDeg(to - from);
    if (d > 180) d -= 360;
    return d;
  },
  bearing(ax, ay, bx, by) { return this.normDeg(Math.atan2(by - ay, bx - ax) * 180 / Math.PI); },

  // Two angle frames meet here and they must not be mixed. The *map/route* lives in image
  // coordinates: 0 along +x (right), increasing clockwise because +y points down. A *driver*
  // thinks in compass/screen terms: 0 pointing up, increasing clockwise. Comparing one against
  // the other directly mirrors every left/right, so route directions are converted out of the
  // image frame before any maneuver is decided. Pure: image bearing in, driver bearing out.
  imageToDriverDeg(imageDeg) {
    // image 0 (right) is driver 90; image 90 (down) is driver 180.
    return this.normDeg(imageDeg + 90);
  },
  driverBearing(ax, ay, bx, by) {
    return this.imageToDriverDeg(this.bearing(ax, ay, bx, by));
  },
  // Which way to point the car. front_heading is the direction the car faces in 0..360, but it
  // is measured the way the map is: 0 along +x (right), increasing towards +y (down). The icon is
  // drawn nose-up, so it needs the driver frame and every path here goes through the same
  // conversion. Leaving it raw pointed the car 90 degrees off - and a test fixture that supplied
  // an already-converted angle hid it, which is why the fixture below now builds what the camera
  // really emits.
  carHeading(vehicle) {
    if (!vehicle) return null;
    if (vehicle.front_is_known && typeof vehicle.front_heading === "number")
      return this.imageToDriverDeg(vehicle.front_heading);
    // No front: the axis is all there is, so the car may be drawn backwards. Better than
    // pointing it at a right angle to the road it is on.
    if (typeof vehicle.heading === "number") return this.imageToDriverDeg(vehicle.heading);
    return null;
  },

  // ---- remaining distance ----------------------------------------------
  // Sum the route from the node nearest the car to the end, plus the car's gap to that node.
  // This is the number that visibly counts down; planning itself is unchanged upstream.
  remainingPx(vehicle, routeDoc, nodes) {
    const { points } = this.routePoints(routeDoc, nodes);
    if (!points.length) return null;
    if (!vehicle || typeof vehicle.x !== "number") return routeDoc.distance ?? null;
    let best = 0, bestD = Infinity;
    for (let i = 0; i < points.length; i++) {
      const d = Math.hypot(points[i][0] - vehicle.x, points[i][1] - vehicle.y);
      if (d < bestD) { bestD = d; best = i; }
    }
    let total = bestD;
    for (let i = best; i < points.length - 1; i++)
      total += Math.hypot(points[i + 1][0] - points[i][0], points[i + 1][1] - points[i][1]);
    return total;
  },

  // ---- the next maneuver ------------------------------------------------
  // A driving instruction, not a graph fact: compare the route's upcoming bearing with the way
  // the car is facing and say it in the driver's frame.
  maneuver(vehicle, routeDoc, nodes) {
    const { points } = this.routePoints(routeDoc, nodes);
    if (points.length < 2) return { icon: "•", text: "即将到达" };
    if (!vehicle) return { icon: "•", text: "正在重新规划路线…" };
    const heading = this.carHeading(vehicle);
    // Find the first route point ahead of the car.
    let k = 0, bestD = Infinity;
    for (let i = 0; i < points.length; i++) {
      const d = Math.hypot(points[i][0] - vehicle.x, points[i][1] - vehicle.y);
      if (d < bestD) { bestD = d; k = i; }
    }
    if (k >= points.length - 1) return { icon: "🏁", text: "即将到达" };
    const bear = this.driverBearing(points[k][0], points[k][1], points[k + 1][0], points[k + 1][1]);
    const rel = heading == null ? 0 : this.turnDeg(heading, bear);
    const segLen = Math.hypot(points[k + 1][0] - points[k][0], points[k + 1][1] - points[k][1]);
    const far = this.formatMetres(segLen);
    if (Math.abs(rel) <= 22) return { icon: "⬆️", text: `沿通道直行（约 ${far}）` };
    if (rel > 22 && rel <= 60) return { icon: "↗️", text: `前方靠右前行（约 ${far}）` };
    if (rel < -22 && rel >= -60) return { icon: "↖️", text: `前方靠左前行（约 ${far}）` };
    if (rel > 60 && rel <= 150) return { icon: "➡️", text: `前方右转（约 ${far}）` };
    if (rel < -60 && rel >= -150) return { icon: "⬅️", text: `前方左转（约 ${far}）` };
    return { icon: "↩️", text: "前方掉头" };
  },

  // ---- arrival ----------------------------------------------------------
  hasArrived(vehicle, target) {
    if (!vehicle || !target) return false;
    if (typeof vehicle.x !== "number" || typeof vehicle.y !== "number") return false;
    return this.pointInPoly(vehicle.x, vehicle.y, target.polygon);
  },

  // ---- the follow camera ------------------------------------------------
  // World->screen: uniform scale, then centred on a focal point, then rotated so the car's own
  // direction is up. A car navigator turns the map instead of turning the arrow: with the car on
  // a lane that is not vertical, a fixed north-up view shows the route at some angle and the
  // driver has to work out which way is forward.
  fitCamera(viewW, viewH, worldW, worldH) {
    const pad = 48;
    const scale = Math.min((viewW - pad * 2) / worldW, (viewH - pad * 2) / worldH);
    return { scale, cx: worldW / 2, cy: worldH / 2 };
  },
  followCamera(viewW, viewH, x, y, scale) {
    return { scale, cx: x, cy: y };
  },
  // The angle the world is turned by so that the car's heading points up the screen. Radians, as
  // canvas wants, and null in the north-up view.
  worldRotation(driverHeading) {
    if (driverHeading == null) return 0;
    return -driverHeading * Math.PI / 180;
  },
  // Keep the view inside the lot. Following a car that parks in a corner would otherwise put a
  // third of the screen on ground that is not a car park at all; a real navigator slides the map
  // so the edge stops at the screen edge and the car drifts off centre instead. If the lot is
  // smaller than the view it is simply centred.
  clampCamera(viewW, viewH, cam, worldW, worldH) {
    const halfW = viewW / 2 / cam.scale, halfH = viewH / 2 / cam.scale;
    const cx = (worldW <= halfW * 2) ? worldW / 2
               : Math.min(Math.max(cam.cx, halfW), worldW - halfW);
    const cy = (worldH <= halfH * 2) ? worldH / 2
               : Math.min(Math.max(cam.cy, halfH), worldH - halfH);
    // rot has to come back with it. Leaving it out cost the whole feature: the clamp returns a
    // new object every frame, so cam.rot was undefined again before the renderer looked at it and
    // the map never turned. Only a pixel check caught that - a test that reads the source for
    // "applyCamera(..., cam.rot)" is satisfied by code that cannot run.
    return { scale: cam.scale, cx, cy, rot: cam.rot || 0 };
  },
  // Canvas order: translate to the middle of the view, rotate, scale, then move the world under
  // the focal point. The rotation is applied after the translation, so it is applied about the
  // middle of the screen - which is where the car is drawn.
  applyCamera(ctx, viewW, viewH, cam, rot) {
    ctx.translate(viewW / 2, viewH / 2);
    ctx.rotate(rot || 0);
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-cam.cx, -cam.cy);
  },
  toScreen(viewW, viewH, cam, rot, wx, wy) {
    const r = rot || 0, cos = Math.cos(r), sin = Math.sin(r);
    const dx = (wx - cam.cx) * cam.scale, dy = (wy - cam.cy) * cam.scale;
    return [viewW / 2 + dx * cos - dy * sin, viewH / 2 + dx * sin + dy * cos];
  },
  // The exact inverse, so a click lands on the bay under the pointer in a turned map. It has to
  // be the inverse or the two would drift apart, and clicking a bay would pick its neighbour.
  screenToWorld(viewW, viewH, cam, rot, sx, sy) {
    const r = rot || 0, cos = Math.cos(r), sin = Math.sin(r);
    const dx = sx - viewW / 2, dy = sy - viewH / 2;
    return [cam.cx + (dx * cos + dy * sin) / cam.scale,
            cam.cy + (-dx * sin + dy * cos) / cam.scale];
  },
};

let viewW0 = 0, viewH0 = 0;

// ============================================================ state
const DOCS = { map: "../out/parking_map.json", state: "../out/parking_state.json",
               route: "../out/route.json" };
const POLL_MS = 250;
const REPLAN_MOVE_PX = 4;
const REPLAN_AFTER_MS = 1500;

let MAP = null, NODES = {}, STATE = null, ROUTE = null;
let PHASE = "IDLE";            // IDLE | NAVIGATING | ARRIVED
let targetId = null;
let lastPlan = { x: null, y: null, at: 0 };
let replanSeq = 0;
let waitingNote = 0;

// The smoothly animated car: we render every frame and lerp this display pose towards the last
// reported pose, so the icon glides instead of jumping on each 250 ms poll.
const car = { x: null, y: null, h: null, visible: false };
let cam = { scale: 1, cx: 400, cy: 300, rot: 0 };
let CHAINS = [];        // open road runs, worked out once per map
let LOOPS = [];        // closed road loops (the ring), drawn as one closed path
let targetCam = null;

const cv = document.getElementById("map");
const ctx = cv.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  viewW0 = window.innerWidth; viewH0 = window.innerHeight;
  cv.width = Math.round(viewW0 * DPR);
  cv.height = Math.round(viewH0 * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

async function getJSON(url) {
  try {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

const vehicleOf = () => STATE?.vehicle ?? null;

// ============================================================ planning
async function startNavigation(id) {
  targetId = String(id);
  PHASE = "NAVIGATING";
  document.body.classList.remove("arrived");
  lastPlan = { x: null, y: null, at: 0 };
  await requestRoute(true);
  updateHud();
}

async function requestRoute(manual) {
  const mine = ++replanSeq;
  let doc = null;
  try {
    const r = await fetch(`/api/route?spot=${encodeURIComponent(targetId)}&t=${Date.now()}`);
    doc = await r.json();
  } catch (e) {
    doc = null;
  }
  if (mine !== replanSeq) return;
  if (doc) {
    ROUTE = doc;
    const v = vehicleOf();
    lastPlan = { x: v?.x ?? null, y: v?.y ?? null, at: Date.now() };
  } else if (manual) {
    transient("正在连接导航服务…", "•");
  }
}

// When to ask for a new route. Same policy as board.html, deliberately: moving is the trigger while
// the car is visible, and the timer is the safety net that still fires when it is not - a bay can
// be taken by someone else while the hero is hidden, and that has to be noticed.
function shouldReplan(now) {
  if (PHASE !== "NAVIGATING" || targetId == null) return false;
  if (!lastPlan || lastPlan.at == null) return true;              // nothing planned yet
  if (now - lastPlan.at >= REPLAN_AFTER_MS) return true;          // the parked safety net
  const v = vehicleOf();
  if (!v || v.visible === false) return false;                    // no fix: nothing to compare against
  if (typeof v.x !== "number" || typeof v.y !== "number") return false;
  if (lastPlan.x == null || lastPlan.y == null) return true;      // a fix appeared where there was none
  return Math.hypot(v.x - lastPlan.x, v.y - lastPlan.y) >= REPLAN_MOVE_PX;
}

function cancelNavigation() {
  PHASE = "IDLE"; targetId = null; ROUTE = null;
  document.body.classList.remove("arrived");
  updateHud();
}

// ============================================================ arrival
function checkArrival() {
  if (PHASE !== "NAVIGATING" || targetId == null) return;
  const target = (MAP?.spots ?? []).find(s => String(s.id) === targetId);
  const v = vehicleOf();
  if (Nav.hasArrived(v, target)) {
    PHASE = "ARRIVED";
    document.body.classList.add("arrived");
    showArrived(targetId);
  }
}

function showArrived(id) {
  document.getElementById("toastTxt").textContent = `已到达 ${id} 号车位`;
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(showArrived._t);
  showArrived._t = setTimeout(() => t.classList.remove("show"), 3200);
}

// ============================================================ input
function eventWorld(evt) {
  const r = cv.getBoundingClientRect();
  const sx = (evt.clientX - r.left), sy = (evt.clientY - r.top);
  // The map can be turned, so this has to be the exact inverse of what the renderer applied;
  // otherwise clicking a bay picks whichever one happens to be 90 degrees away.
  const [wx, wy] = Nav.screenToWorld(viewW0, viewH0, cam, cam.rot, sx, sy);
  return { x: wx, y: wy };
}

cv.addEventListener("click", evt => {
  if (PHASE === "NAVIGATING" || PHASE === "ARRIVED") return;
  if (!MAP) return;
  const w = eventWorld(evt);
  const bay = Nav.bayAt(MAP, w.x, w.y);
  if (!bay) return;
  const st = STATE?.spots?.[String(bay.id)]?.state;
  if (st === "EMPTY") startNavigation(bay.id);
  else if (st === "OCCUPIED") transient("这个车位有车，选一个绿色空车位", "🚫");
  else transient("现在看不清这个车位，稍等一下", "•");
});

cv.addEventListener("mousemove", evt => {
  if (PHASE !== "IDLE" || !MAP) { cv.style.cursor = ""; return; }
  const w = eventWorld(evt);
  const bay = Nav.bayAt(MAP, w.x, w.y);
  cv.style.cursor = bay ? "pointer" : "";
});

document.getElementById("cancelBtn").addEventListener("click", cancelNavigation);
document.getElementById("againBtn").addEventListener("click", cancelNavigation);

// ============================================================ transient note
let toastTimer = null;
function transient(text, icon) {
  document.getElementById("toastTxt").textContent = text;
  document.querySelector("#toast .big").textContent = icon || "•";
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ============================================================ HUD
function el(id) { return document.getElementById(id); }

// Map the planner's answer to the only two driver-facing transient states. The hero being out of
// view (its own refusal, or no vehicle at all) is "waiting for a fix"; a route that cannot be
// given for any other reason is "finding a new route". The codes are handled here and never shown.
function routeSituation(v, routeDoc) {
  const noFix = !v || v.visible === false || routeDoc?.code === "hero-not-visible";
  if (noFix)
    return { status: "定位等待…", icon: "•", text: "正在重新定位车辆…" };
  if (routeDoc?.ok)
    return { status: "导航中", ...Nav.maneuver(v, routeDoc, NODES) };
  return { status: "重新规划中…", icon: "•", text: "正在重新规划路线…" };
}

function updateHud() {
  const v = vehicleOf();

  if (PHASE === "IDLE") {
    el("statusPill").innerHTML = "停车场导航";
    el("title").textContent = "选择一个空车位";
    el("subtitle").innerHTML = '点一个<b style="color:var(--green)">绿色空车位</b>，开始导航';
    el("arrow").textContent = "•";
    el("maneuverTxt").textContent = "请选择目标车位";
    el("distV").innerHTML = "–";
    el("targetV").innerHTML = "–";
    return;
  }

  if (PHASE === "ARRIVED") {
    el("statusPill").innerHTML = `已到达 <b>${targetId}</b> 号车位`;
    el("title").textContent = "已到达";
    el("arrow").textContent = "✅";
    el("maneuverTxt").textContent = `${targetId} 号车位`;
    el("distV").innerHTML = "0<small>m</small>";
    el("targetV").innerHTML = `${targetId}<small>号</small>`;
    return;
  }

  // NAVIGATING. The planner may refuse on a given poll - the bay filled, the car left view, no
  // path right now - but none of that is a technical error to a driver: it is either "waiting for
  // a fix" or "working out a new route". routeSituation maps the planner's codes to those two.
  const hidden = !v || v.visible === false;
  const sit = routeSituation(v, ROUTE);
  el("statusPill").textContent = sit.status;
  el("arrow").textContent = sit.icon;
  el("maneuverTxt").textContent = sit.text;
  const rem = (hidden || !ROUTE?.ok) ? null : Nav.remainingPx(v, ROUTE, NODES);
  el("distV").innerHTML = rem == null ? "–" : Nav.formatMetres(rem).replace(" m", "<small>m</small>");
  el("targetV").innerHTML = `${targetId}<small>号</small>`;
}

// ============================================================ render
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngle(a, b, t) {
  let d = Nav.normDeg(b - a);
  if (d > 180) d -= 360;
  return Nav.normDeg(a + d * t);
}

function updateCamera() {
  const worldW = MAP?.coordinate_system?.width ?? 800;
  const worldH = MAP?.coordinate_system?.height ?? 600;
  const v = vehicleOf();
  // Arriving must not yank the view back to the whole lot: the last thing a driver looked at
  // was the bay they were aiming for, so the camera keeps following the stopped car.
  const useFollow = (PHASE === "NAVIGATING" || PHASE === "ARRIVED") &&
                    v && v.visible !== false && car.x != null;
  if (useFollow) targetCam = Nav.followCamera(viewW0, viewH0, car.x, car.y, driveScale());
  else {
    const fit = Nav.fitCamera(viewW0, viewH0, worldW, worldH);
    targetCam = fit;
  }
  // Turn the map so the car's own heading is up, which is what makes a route on a lane that is
  // not vertical readable at a glance. Eased, and along the short way round: at 359 degrees it
  // must go forward by two, not backwards by 358.
  const heading = Nav.carHeading(v);
  const wantRot = (useFollow && heading != null) ? Nav.worldRotation(heading) : 0;
  cam.rot = lerpRad(cam.rot ?? 0, wantRot, 0.12);

  const t = 0.14;
  cam.scale = lerp(cam.scale, targetCam.scale, t);
  cam.cx = lerp(cam.cx, targetCam.cx, t);
  cam.cy = lerp(cam.cy, targetCam.cy, t);
  if (useFollow) cam = Nav.clampCamera(viewW0, viewH0, cam, worldW, worldH);
}

// Shortest-arc interpolation in radians, for the same reason lerpAngle exists in degrees.
function lerpRad(a, b, t) {
  const two = Math.PI * 2;
  let d = ((b - a + Math.PI) % two + two) % two - Math.PI;
  return a + d * t;
}

let _driveScale = null;
function driveScale() {
  if (_driveScale != null) return _driveScale;
  // Zoom in a fixed amount beyond the fit-to-lot scale, but keep it sane on small windows.
  const fit = Nav.fitCamera(viewW0, viewH0, 800, 600);
  _driveScale = Math.max(fit.scale * 1.7, Math.min(viewW0, viewH0) / 240);
  return _driveScale;
}

// ============================================================ the map style
// A navigation map rather than a diagram. The rules that make one read as the other, in the order
// they matter: the ground is flat and quiet, roads are *lighter* than the ground and carry a
// casing so they keep an edge at any angle, the route is the brightest thing on screen, bays
// become texture instead of colour once you are driving, only your destination has a marker, and
// every label sits on a rounded plate so it stays legible over whatever is under it.
// Three of them, because "like a navigation app" is not one thing: the night view is what a
// phone shows after dark, the day view is the beige-on-white that a map shows at noon, and the
// indoor view is what an underground car park looks like - concrete, white markings, no beige.
// Pick with ?style=day or ?style=indoor; the default is night.
//
// Every colour a drawing function needs is in here, including the label colours, so a style is
// one object and nothing has to be changed in two places to try one.
const STYLES = {
  // Measured off ~/Desktop/nv.png (721x675), the style that was asked for: a white floor, the
  // aisle as a wide grey surface (grey covers 23%, in large connected regions - not a thin road),
  // the bays cyan when free (11.6%) and coral when taken (6.2%), and green POI markers (1.5%).
  // Kept as exact samples rather than re-derived: these are measurements.
  real: {
    roadSurfaceWidth: 96,    // generous ring band; bay polygons are carved out afterwards
    roadStubWidth: 44,       // entrance stub (short branch)
    ground: "#ffffff",
    lotEdge: "rgba(0,0,0,.10)",
    roadCasing: "#e6e6e6",
    roadFill: "#a7a7a7",
    roadWidth: 20,
    routeCasing: "#ffffff",
    routeFill: "#2f7bf0",
    routeWidth: 9,
    faintEdge: "rgba(0,0,0,.10)",
    bayEdge: "rgba(0,0,0,.22)",
    freeEdge: "#1f9cb8",
    freeFill: "rgba(58,197,226,.42)",
    freeText: "#0b6c84",
    takenEdge: "#c85a5d",
    takenFill: "rgba(221,106,109,.38)",
    takenText: "#a04347",
    unknownText: "#777",
    plate: "rgba(255,255,255,.92)",
    text: "#2a2d33",
    muted: "#5f6368",
    target: "#2f7bf0",
    targetDot: "#ffffff",
    entrance: "#34a853",
    entranceText: "#137333",
    car: "#ef4444",
    carRing: "#ffffff",
  },
  night: {
    ground: "#10151d",
    lotEdge: "rgba(255,255,255,.07)",
    roadCasing: "#39434f",
    roadFill: "#2a3340",
    roadWidth: 18,
    routeCasing: "#0d2a4d",
    routeFill: "#3fa9ff",
    routeWidth: 10,
    faintEdge: "rgba(255,255,255,.07)",
    bayEdge: "rgba(255,255,255,.16)",
    freeEdge: "rgba(74,222,128,.85)",
    freeFill: "rgba(74,222,128,.12)",
    freeText: "#b9f6d0",
    takenEdge: "rgba(255,255,255,.16)",
    takenFill: "rgba(255,255,255,.05)",
    takenText: "#c8cedb",
    unknownText: "#98a3b4",
    plate: "rgba(9,13,19,.82)",
    text: "#eaf0f8",
    muted: "#98a3b4",
    target: "#3fa9ff",
    targetDot: "#0b1220",
    entrance: "#8fd3ff",
    entranceText: "#cfe6ff",
    car: "#ef4444",
    carRing: "#ffffff",
  },
  day: {
    ground: "#f1efe9",
    lotEdge: "rgba(0,0,0,.10)",
    roadCasing: "#dedbd2",
    roadFill: "#ffffff",
    roadWidth: 18,
    routeCasing: "#1a5fd0",
    routeFill: "#4285f4",
    routeWidth: 10,
    faintEdge: "rgba(0,0,0,.07)",
    bayEdge: "rgba(0,0,0,.16)",
    freeEdge: "#137333",
    freeFill: "rgba(19,115,51,.10)",
    freeText: "#137333",
    takenEdge: "rgba(0,0,0,.16)",
    takenFill: "rgba(0,0,0,.05)",
    takenText: "#5f6368",
    unknownText: "#80868b",
    plate: "rgba(255,255,255,.92)",
    text: "#202124",
    muted: "#5f6368",
    target: "#1a73e8",
    targetDot: "#ffffff",

    entranceText: "#1a73e8",

  },
  indoor: {
    ground: "#33363b",
    lotEdge: "rgba(255,255,255,.08)",
    roadCasing: "#4b5057",
    roadFill: "#3f444b",
    roadWidth: 20,
    routeCasing: "#12365e",
    routeFill: "#4aa8ff",
    routeWidth: 11,
    faintEdge: "rgba(255,255,255,.10)",
    bayEdge: "rgba(255,255,255,.32)",
    freeEdge: "rgba(255,214,10,.85)",
    freeFill: "rgba(255,214,10,.10)",
    freeText: "#ffd60a",
    takenEdge: "rgba(255,255,255,.18)",
    takenFill: "rgba(255,255,255,.06)",
    takenText: "#d7dbe2",
    unknownText: "#a9aeb6",
    plate: "rgba(18,20,24,.85)",
    text: "#f2f4f8",
    muted: "#a9aeb6",
    target: "#ffd60a",
    targetDot: "#2b2f34",
    entrance: "#c9d1d9",
    entranceText: "#e7ebf0",
    car: "#ef4444",
    carRing: "#ffffff",
  },
};
const styleName = new URLSearchParams(location.search).get("style") || "real";
const STYLE = STYLES[styleName] ?? STYLES.night;
// The page chrome follows the map, or a light map would sit inside a dark frame.
document.documentElement.dataset.style = styleName;

function drawWorld() {
  ctx.clearRect(0, 0, viewW0, viewH0);
  if (!MAP) return;

  ctx.save();
  Nav.applyCamera(ctx, viewW0, viewH0, cam, cam.rot);
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  drawGround();
  // The road is a wide surface the bays sit on (see roadSurfaceWidth): draw it first so the bay
  // polygons cover it; otherwise the corridor band paints the bays out.
  drawRoads();
  for (const s of MAP.spots) drawBayShape(s);
  drawRoute();
  drawEntrances();
  drawTarget();
  for (const s of MAP.spots) drawBayLabel(s);
  if (car.visible && car.x != null) drawCar(car.x, car.y, car.h ?? 0);

  ctx.restore();
}

const drive = () => PHASE === "NAVIGATING" || PHASE === "ARRIVED";

function drawGround() {
  const w = MAP.coordinate_system?.width ?? 800;
  const h = MAP.coordinate_system?.height ?? 600;
  ctx.fillStyle = STYLE.ground;
  ctx.fillRect(0, 0, w, h);
  // The edge of the lot, so the map does not bleed into nothing at the boundary.
  ctx.strokeStyle = STYLE.lotEdge;
  ctx.lineWidth = 2 / cam.scale;
  ctx.strokeRect(1, 1, w - 2, h - 2);
}

// Roads: one casing and one fill per chain, both the full length of the road. No centre dashes -
// they are the thing that made a lane look like a row of pieces, and a real map does not draw them
// on an aisle either.
function drawRoads() {
  const trace = (pts, closed) => {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    if (closed) ctx.closePath();
  };
  // Coordinates of every node that belongs to a loop, so open runs already covered by a loop
  // (the ring edges) are not stroked a second time.
  const loopPoints = new Set();
  for (const cyc of LOOPS)
    for (const id of cyc) {
      const n = NODES[id];
      loopPoints.add(Math.round(n.x) + "," + Math.round(n.y));
    }

  // 1) The ring, one closed band per loop: no end caps, no per-edge seams.
  for (const cyc of LOOPS) {
    const pts = cyc.map(id => [NODES[id].x, NODES[id].y]);
    if (pts.length < 3) continue;
    if (STYLE.roadSurfaceWidth) {
      // No light casing (it read as a white outline): one solid band; bays are carved below.
      trace(pts, true);
      ctx.strokeStyle = STYLE.roadFill;
      ctx.lineWidth = STYLE.roadSurfaceWidth; ctx.stroke();
    } else {
      trace(pts, true);
      ctx.strokeStyle = STYLE.roadCasing;
      ctx.lineWidth = (STYLE.roadWidth + 3) / cam.scale; ctx.stroke();
      trace(pts, true);
      ctx.strokeStyle = STYLE.roadFill;
      ctx.lineWidth = STYLE.roadWidth / cam.scale; ctx.stroke();
    }
  }

  // 2) Open runs not on a loop (the entrance stub): solid, no light rim.
  for (const chain of CHAINS) {
    if (chain.length < 2) continue;
    const onLoop = chain.every(p => loopPoints.has(Math.round(p[0]) + "," + Math.round(p[1])));
    if (onLoop) continue;
    trace(chain, false);
    ctx.strokeStyle = STYLE.roadFill;
    ctx.lineWidth = (STYLE.roadStubWidth ?? STYLE.roadWidth) /
                    (STYLE.roadSurfaceWidth ? 1 : cam.scale);
    ctx.stroke();
  }

  // 3) Carve the bay polygons out of the surface: edges sit right against the spots, band never
  // shows through a bay. destination-out erases the gray; bays are drawn after on top.
  if (STYLE.roadSurfaceWidth) {
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    for (const spot of MAP.spots) {
      ctx.beginPath();
      spot.polygon.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

// The route is drawn last of the lines so nothing crosses over it, with a dark casing under a
// bright fill: that is what makes it readable where it passes a junction, and it is the one thing
// on the map the driver has to be able to follow without looking for it.
function drawRoute() {
  if (!ROUTE?.ok) return;
  const { points } = Nav.routePoints(ROUTE, NODES);
  if (points.length < 2) return;
  const path = () => {
    ctx.beginPath();
    points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  };
  path(); ctx.strokeStyle = STYLE.routeCasing; ctx.lineWidth = (STYLE.routeWidth + 5) / cam.scale; ctx.stroke();
  path(); ctx.strokeStyle = STYLE.routeFill; ctx.lineWidth = STYLE.routeWidth / cam.scale; ctx.stroke();
}

// Bays. While driving they are texture - a hairline each - because the free ones are no longer the
// question; choosing one, they carry their state, because that is the question.
function drawBayShape(s) {
  const state = STATE?.spots?.[String(s.id)]?.state ?? "UNKNOWN";
  const isTarget = String(s.id) === targetId;
  const p = s.polygon;
  const poly = () => {
    ctx.beginPath();
    p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
  };
  if (isTarget) {
    poly(); ctx.fillStyle = "rgba(47,123,240,.16)"; ctx.fill();
    poly(); ctx.strokeStyle = STYLE.target; ctx.lineWidth = 3 / cam.scale; ctx.stroke();
    return;
  }
  if (drive()) {
    poly(); ctx.strokeStyle = STYLE.faintEdge; ctx.lineWidth = 1.5 / cam.scale; ctx.stroke();
    return;
  }
  if (state === "EMPTY") {
    poly(); ctx.fillStyle = STYLE.freeFill; ctx.fill();
    poly(); ctx.strokeStyle = STYLE.freeEdge; ctx.lineWidth = 2.2 / cam.scale; ctx.stroke();
  } else if (state === "OCCUPIED") {
    poly(); ctx.fillStyle = STYLE.takenFill; ctx.fill();
    poly(); ctx.strokeStyle = STYLE.takenEdge; ctx.lineWidth = 1.6 / cam.scale; ctx.stroke();
  } else {
    poly(); ctx.strokeStyle = STYLE.faintEdge; ctx.lineWidth = 1.5 / cam.scale; ctx.stroke();
  }
}

function drawBayLabel(s) {
  const state = STATE?.spots?.[String(s.id)]?.state ?? "UNKNOWN";
  const isTarget = String(s.id) === targetId;
  const [cx, cy] = Nav.centroid(s.polygon);
  if (isTarget) return;                       // the marker above carries the number
  if (drive()) {
    // Nothing but the road you are on and where you are going: that is the whole point of a
    // navigation view, and forty numbers competing with the route is how it stops being one.
    return;
  }
  const colour = state === "EMPTY" ? STYLE.freeText
    : state === "OCCUPIED" ? STYLE.takenText : STYLE.unknownText;
  label(cx, cy, String(s.id), colour, 12);
}

// A destination pin, the way a map marks where you are going - not another outlined polygon for
// the driver to find among forty of them.
function drawTarget() {
  if (targetId == null) return;
  const s = (MAP.spots ?? []).find(sp => String(sp.id) === targetId);
  if (!s) return;
  const [x, y] = Nav.centroid(s.polygon);
  const r = 10 / cam.scale;            // screen px, undone by the zoom like every other marker
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.beginPath();                            // teardrop: a circle with a point at the bottom
  ctx.moveTo(0, r * 1.9);
  ctx.quadraticCurveTo(-r, r * 0.5, -r, 0);
  ctx.arc(0, 0, r, Math.PI, 0);
  ctx.quadraticCurveTo(r, r * 0.5, 0, r * 1.9);
  ctx.closePath();
  ctx.fillStyle = STYLE.target; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = STYLE.carRing; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 3.6 / cam.scale, 0, Math.PI * 2);
  ctx.fillStyle = STYLE.targetDot; ctx.fill();
  ctx.restore();
  label(x, y - r * 3.4, String(targetId), STYLE.text, 13);
}

function drawEntrances() {
  for (const g of MAP.entrances ?? []) {
    const n = NODES[g.node];
    if (!n) continue;
    ctx.beginPath(); ctx.arc(n.x, n.y, 7 / cam.scale, 0, Math.PI * 2);
    ctx.fillStyle = STYLE.entrance; ctx.fill();
    ctx.strokeStyle = STYLE.plate; ctx.lineWidth = 2 / cam.scale; ctx.stroke();
    label(n.x, n.y - 18 / cam.scale, "入口", STYLE.entranceText, 12);
  }
}

function label(x, y, text, color, size) {
  // Bay numbers stay level while the map turns: a rotated label is unreadable, and a bay number
  // nobody can read is worse than no bay number. On a rounded plate, the way a map draws a name
  // over ground that could be anything.
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-(cam.rot || 0));
  const fsPx = (size || 12) / cam.scale;
  ctx.font = `600 ${fsPx}px system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width + 12 / cam.scale, h = fsPx + 8 / cam.scale;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, 5 / cam.scale);
  else ctx.rect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = STYLE.plate; ctx.fill();
  ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  ctx.restore();
}

// The car, as a navigation arrow: a rounded chevron with a white ring and a soft shadow, which is
// what a driver's eye is trained to follow. Kept red, because on this lot the red car is the hero
// and a blue arrow would be a different car.
function drawCar(x, y, heading) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading * Math.PI / 180);
  // The whole marker is screen px, not the 15 world units it was drawn in - at driving zoom that
  // came out at 56 px. Scaling the shape by the inverse zoom keeps the arrow the same size and
  // every width inside it (ring, windscreen) reads on screen as written.
  ctx.scale(1 / cam.scale, 1 / cam.scale);
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;

  ctx.beginPath();                            // chevron, nose up the local -y axis
  ctx.moveTo(0, -15);
  ctx.quadraticCurveTo(8, -8, 9, 2);
  ctx.quadraticCurveTo(9, 11, 5, 13);
  ctx.lineTo(0, 10);
  ctx.lineTo(-5, 13);
  ctx.quadraticCurveTo(-9, 11, -9, 2);
  ctx.quadraticCurveTo(-8, -8, 0, -15);
  ctx.closePath();
  ctx.fillStyle = STYLE.car; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = STYLE.carRing; ctx.lineWidth = 2.6; ctx.stroke();
  // a windscreen line near the nose, so the front reads even in silhouette
  ctx.beginPath(); ctx.moveTo(-4, -5); ctx.lineTo(0, -9); ctx.lineTo(4, -5);
  ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.restore();
}

// ============================================================ animation
function tick() {
  // ease the display car towards the last measured pose
  const v = vehicleOf();
  if (v && v.visible !== false && typeof v.x === "number") {
    const th = Nav.carHeading(v);
    if (car.x == null) { car.x = v.x; car.y = v.y; car.h = th ?? 0; }
    else {
      car.x = lerp(car.x, v.x, 0.22);
      car.y = lerp(car.y, v.y, 0.22);
      car.h = lerpAngle(car.h, th ?? car.h, 0.22);
    }
    car.visible = true;
  } else {
    car.visible = false;
  }

  updateCamera();
  drawWorld();
  requestAnimationFrame(tick);
}

// ============================================================ poll
async function loadMap() {
  const doc = await getJSON(DOCS.map);
  if (!doc) return false;
  MAP = doc;
  NODES = Nav.nodesIndex(doc);
  const edges = doc.road_network?.edges ?? [];
  CHAINS = Nav.roadChains(NODES, edges);
  LOOPS = Nav.roadLoops(NODES, edges);
  return true;
}

async function poll() {
  if (!MAP && !(await loadMap())) {
    el("statusPill").textContent = "正在等待地图…";
    return;
  }
  const stateDoc = await getJSON(DOCS.state);
  if (stateDoc) STATE = stateDoc;

  // Adopt a route written by anyone (plan.py, another tab) the same way board does.
  const fileRoute = await getJSON(DOCS.route);
  if (fileRoute && targetId != null &&
      String(fileRoute.target_spot) === String(targetId) &&
      JSON.stringify(fileRoute) !== JSON.stringify(ROUTE)) {
    ROUTE = fileRoute;
  }

  checkArrival();
  if (PHASE === "NAVIGATING" && shouldReplan(Date.now())) await requestRoute(false);

  updateHud();
}

async function boot() {
  if (!(await loadMap())) {
    el("statusPill").textContent = "正在等待地图…";
    setTimeout(boot, 1000);
    return;
  }
  const stateDoc = await getJSON(DOCS.state);
  if (stateDoc) STATE = stateDoc;
  tick();
  poll();
  setInterval(poll, POLL_MS);
  // Deep link: ?spot=10 starts guiding straight to a bay, the same as clicking it.
  const deep = new URLSearchParams(location.search).get("spot");
  if (deep && STATE?.spots?.[deep]?.state === "EMPTY") startNavigation(deep);
}
boot();
</script>
