<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>地磁测试 — B1..B4</title>
<style>
  :root { --bg:#10141a; --card:#1a2029; --line:#2a3340; --text:#e6edf3; --dim:#8b98a8;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px 22px 40px; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  h1 { margin:0 0 4px; font-size:19px; font-weight:600; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:16px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  button { font:inherit; font-weight:600; padding:9px 18px; border-radius:8px; border:1px solid #2f81f7;
           background:#1f6feb; color:#fff; cursor:pointer; }
  button:disabled { background:#20303f; border-color:#2a3340; color:var(--dim); cursor:default; }
  .note { color:var(--dim); font-size:13px; }
  .note.bad { color:var(--bad); } .note.ok { color:var(--ok); }
  .cards { display:grid; grid-template-columns:repeat(4, minmax(180px, 1fr)); gap:14px; margin:16px 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .name { font-size:20px; font-weight:700; letter-spacing:.5px; }
  .card .ch { color:var(--dim); font-size:12px; margin:2px 0 10px; }
  .card .state { font-size:15px; font-weight:700; margin-bottom:8px; }
  .state.EMPTY { color:var(--ok); } .state.OCCUPIED { color:var(--warn); }
  .state.UNKNOWN { color:var(--dim); }
  .delta { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .delta small { font-size:14px; color:var(--dim); font-weight:400; }
  .track { height:8px; background:#0d1117; border-radius:6px; margin-top:10px; overflow:hidden;
           border:1px solid var(--line); }
  .fill { height:100%; width:0; background:var(--accent); transition:width .18s linear; }
  .fill.hot { background:var(--warn); }
  .detail { color:var(--dim); font-size:11px; margin-top:6px; min-height:15px; }
  .rules { color:var(--dim); font-size:11px; margin-top:6px; font-variant-numeric:tabular-nums; }
  table { border-collapse:collapse; width:100%; max-width:820px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:600; }
  select { font:inherit; background:#0d1117; color:var(--text); border:1px solid var(--line);
           border-radius:6px; padding:4px 6px; }
  .hint { color:var(--dim); font-size:12px; margin-top:10px; max-width:820px; }
  .stale { color:var(--bad); }
</style>
</head>
<body>
<h1>地磁测试 — B1..B4</h1>
<div class="sub">
  <span id="board">连接中…</span>
  <span id="baseinfo"></span>
  <span id="build" style="opacity:.6"></span>
</div>

<div class="bar">
  <button id="baseline">建立 Baseline</button>
  <button id="copy" style="background:#21262d;border-color:#30363d">复制当前诊断数据</button>
  <span class="note" id="note">先把 B1–B4 全部清空，再点这个按钮（采集 3 秒）。</span>
</div>

<div class="cards" id="cards"></div>

<table>
  <thead><tr><th>通道</th><th>X</th><th>Y</th><th>Z</th><th>|B| µT</th><th>数据年龄</th><th>对应车位</th></tr></thead>
  <tbody id="channels"></tbody>
</table>
<div class="hint">
  所有通道都列在这里，未映射的车位显示 UNKNOWN，但原始通道不隐藏。在最后一列选择某个车位，保存后立即生效
  （写入 <code>vision/config/mag_bays.json</code>）。判定用 1 秒滑窗、3.8 µT 进入、0.6 µT 回差。
</div>

<script>
const BAYS = ["B1", "B2", "B3", "B4"];
let mapping = {};
let busy = false;

async function post(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify(body || {}) });
  return response.json();
}

function stateClass(state) { return state === "EMPTY" ? "EMPTY" : state === "OCCUPIED" ? "OCCUPIED" : "UNKNOWN"; }

function renderCards(bays, thresholds) {
  // A missing argument here used to throw and abort the whole refresh, which left every dropdown
  // unassigned and looked exactly like the bay mapping disappearing.
  thresholds = thresholds || { enter: null, exit: null };
  const host = document.getElementById("cards");
  if (host.children.length !== bays.length) {
    host.innerHTML = bays.map(bay => `
      <div class="card" id="card-${bay.bay}">
        <div class="name">${bay.bay}</div>
        <div class="ch" id="ch-${bay.bay}"></div>
        <div class="state" id="state-${bay.bay}">—</div>
        <div class="delta"><span id="delta-${bay.bay}">—</span><small> µT</small></div>
        <div class="rules" id="rules-${bay.bay}"></div>
        <div class="track"><div class="fill" id="fill-${bay.bay}"></div></div>
        <div class="detail" id="detail-${bay.bay}"></div>
      </div>`).join("");
  }
  for (const bay of bays) {
    const id = bay.bay;
    document.getElementById("ch-" + id).textContent =
      bay.channel === null || bay.channel === undefined ? "未映射通道" : "通道 ch" + bay.channel;
    setText("state-" + id, bay.state, "state " + stateClass(bay.state));
    setText("delta-" + id, bay.delta_ut === null ? "—" : bay.delta_ut.toFixed(2));
    const fill = document.getElementById("fill-" + id);
    fill.style.width = Math.round((bay.bar || 0) * 100) + "%";
    fill.className = "fill" + (bay.state === "OCCUPIED" ? " hot" : "");
    // The card has to show why it says what it says: with a magnet in play the delta can be tens of
    // uT, and "still OCCUPIED" is then either hysteresis or a baseline that contains the magnet.
    const enter = thresholds.enter === null ? null : thresholds.enter;
    const exit = thresholds.exit === null ? null : thresholds.exit;
    setText("rules-" + id,
      (enter === null ? "阈值未加载" : `进入 ≥ ${enter.toFixed(1)} · 退出 < ${exit.toFixed(1)} µT`)
      + (bay.baseline_field_ut === null || bay.baseline_field_ut === undefined
          ? "" : `  · 基线 ${bay.baseline_field_ut.toFixed(0)} µT`));
    setText("detail-" + id, bay.detail || "");
  }
}

function bayForChannel(channel, currentMapping) {
  const hit = Object.entries(currentMapping).find(([, value]) => value === channel);
  return hit ? hit[0] : "";
}

function ensureChannelRows(channels) {
  // Rows are built once per set of channels. Rebuilding them on every refresh destroyed any <select>
  // the operator had just opened, which is why the bay column could not be used at all.
  const body = document.getElementById("channels");
  const signature = channels.map(c => c.ch).join(",");
  if (body.dataset.channels === signature) return;
  body.dataset.channels = signature;
  body.innerHTML = channels.map(c => `
    <tr>
      <td>ch${c.ch}</td>
      <td id="cx-${c.ch}">—</td>
      <td id="cy-${c.ch}">—</td>
      <td id="cz-${c.ch}">—</td>
      <td id="cf-${c.ch}">—</td>
      <td id="ca-${c.ch}">—</td>
      <td>
        <select id="cmap-${c.ch}" data-ch="${c.ch}">
          <option value="">—</option>
          ${BAYS.map(bay => `<option value="${bay}">${bay}</option>`).join("")}
        </select>
      </td>
    </tr>`).join("");
  for (const select of body.querySelectorAll("select")) {
    select.onchange = async event => {
      const channel = Number(event.target.dataset.ch);
      const bay = event.target.value;
      const pairs = {};
      for (const name of BAYS) {
        if (mapping[name] === channel) pairs[name] = null;     // one channel, one bay
      }
      if (bay) pairs[bay] = channel;
      await post("/api/map", { pairs });
      await tick();
    };
  }
}

// A live page that rewrites text every 350 ms makes it impossible to select or copy anything: the
// selection dies with each write. Two rules fix that without stopping the updates - write only when
// the value actually changed, and stop writing entirely while the operator has something selected.
function hasSelection() {
  const selection = (typeof window !== "undefined" && window.getSelection)
    ? window.getSelection() : null;
  return !!(selection && selection.toString().length > 0);
}

function setText(id, text, className) {
  const node = document.getElementById(id);
  if (!node) return;
  if (node.textContent === String(text) && node.className === (className || node.className)) return;
  node.textContent = String(text);
  if (className !== undefined) node.className = className;
}

let paused = false;

function updateChannelRows(channels, currentMapping) {
  if (paused) return;
  for (const c of channels) {
    const cells = { x: `cx-${c.ch}`, y: `cy-${c.ch}`, z: `cz-${c.ch}`,
                    f: `cf-${c.ch}`, a: `ca-${c.ch}` };
    const set = (id, text, stale) => {
      setText(id, text, id === cells.a ? (stale ? "stale" : "") : undefined);
    };
    set(cells.x, c.x);
    set(cells.y, c.y);
    set(cells.z, c.z);
    set(cells.f, c.field_ut === null ? "—" : c.field_ut.toFixed(2));
    set(cells.a, c.age.toFixed(1) + " s", c.age > 2);
    const select = document.getElementById(`cmap-${c.ch}`);
    // Never move a dropdown the operator is using.
    if (select && document.activeElement !== select) {
      select.value = bayForChannel(c.ch, currentMapping);
    }
  }
}

function renderChannels(channels, currentMapping) {
  ensureChannelRows(channels);
  updateChannelRows(channels, currentMapping);
}

async function tick() {
  let data;
  try {
    const response = await fetch("/api/state", { cache: "no-store" });
    data = await response.json();
  } catch (error) {
    document.getElementById("board").textContent = "页面与后台断开（后台进程还在吗？）";
    return;
  }
  mapping = data.mapping || {};
  lastData = data;
  paused = hasSelection();
  if (paused) return;                       // keep the selection alive; resume when it is cleared
  setText("board",
    data.board_ok ? `板子 ${data.board} · 轮询 ${data.polls} 次 · 重复 ${data.duplicates} 次`
                  : `板子 ${data.board || "?"} 无响应 ${data.error ? "(" + data.error + ")" : ""}`);
  setText("build", data.build ? ` · 后台版本 ${data.build}` : "");
  const base = data.baseline || {};
  // Computed once, here, and used by every renderCards call: an earlier patch put this inside one
  // branch only, so the normal path passed null and every card said "thresholds not loaded" while
  // the server was sending 3.8 all along.
  const enterUt = (data.threshold_ut === null || data.threshold_ut === undefined)
    ? null : data.threshold_ut;
  const hysteresisUt = (data.hysteresis_ut === null || data.hysteresis_ut === undefined)
    ? 0 : data.hysteresis_ut;
  const thresholds = { enter: enterUt,
                       exit: enterUt === null ? null : Math.max(0, enterUt - hysteresisUt) };
  setText("baseinfo", base.loaded
    ? ` · Baseline: ${base.valid}/${base.total} 有效 · 阈值 ${data.threshold_ut} µT`
    : " · 还没有 Baseline");
  const note = document.getElementById("note");
  const unmapped = BAYS.filter(bay => mapping[bay] === null || mapping[bay] === undefined);
  if (!data.capturing && unmapped.length === BAYS.length) {
    // Nothing mapped means nothing can be captured; say what to do before the button is pressed.
    note.textContent = "还没有把通道指给车位：在下面的表格里，把车放到某个车位，看哪一列的数值跳动最大，"
                     + "就在最后一列把那个车位选上。至少映射一个车位后才能建立 Baseline。";
    note.className = "note bad";
    document.getElementById("baseline").disabled = false;
    renderCards(data.bays || [], thresholds);
    renderChannels(data.channels || [], mapping);
    return;
  }
  if (data.capturing) {
    note.textContent = "正在采集 Baseline…（约 3 秒，别动车）";
    note.className = "note";
    document.getElementById("baseline").disabled = true;
  } else {
    note.textContent = data.capture_note ? "上次: " + data.capture_note
                                         : "先把 B1–B4 全部清空，再点这个按钮（采集 3 秒）。";
    note.className = "note" + (/failed/.test(data.capture_note || "") ? " bad" : "");
    document.getElementById("baseline").disabled = false;
  }
  renderCards(data.bays || [], thresholds);
  renderChannels(data.channels || [], mapping);
}

let lastData = null;

function diagnosticsText() {
  const d = lastData;
  if (!d) return "还没有数据";
  const lines = [];
  lines.push(`board        ${d.board}  ok=${d.board_ok}  polls=${d.polls}  duplicates=${d.duplicates}`);
  lines.push(`build        ${d.build}`);
  lines.push(`threshold    enter ${d.threshold_ut} uT   hysteresis ${d.hysteresis_ut} uT`);
  const b = d.baseline || {};
  lines.push(`baseline     loaded=${b.loaded} valid=${b.valid}/${b.total} at=${b.calibrated_at} from=${b.source}`);
  lines.push("");
  lines.push("bay  ch   state      delta_ut  baseline|B|  detail");
  for (const bay of d.bays || []) {
    lines.push(`${bay.bay}  ${bay.channel === null ? "-" : bay.channel}    ${String(bay.state).padEnd(9)}  ` +
               `${(bay.delta_ut === null ? "-" : bay.delta_ut.toFixed(2)).padStart(8)}  ` +
               `${(bay.baseline_field_ut === null ? "-" : bay.baseline_field_ut.toFixed(1)).padStart(10)}  ` +
               `${bay.detail || ""}`);
  }
  lines.push("");
  lines.push("ch   x       y       z       field_ut  age_s  reads");
  for (const c of d.channels || []) {
    lines.push(`${c.ch}  ${String(c.x).padStart(7)} ${String(c.y).padStart(7)} ${String(c.z).padStart(7)} ` +
               `${(c.field_ut === null ? "-" : c.field_ut.toFixed(2)).padStart(9)}  ` +
               `${c.age.toFixed(2).padStart(5)}  ${c.reads}`);
  }
  lines.push("");
  lines.push("mapping  " + JSON.stringify(d.mapping));
  return lines.join("\n");
}

document.getElementById("copy").onclick = async () => {
  const text = diagnosticsText();
  const note = document.getElementById("note");
  try {
    await navigator.clipboard.writeText(text);
    note.textContent = "已复制 ✓（可直接粘贴）";
    note.className = "note ok";
  } catch (error) {
    // Fallback for pages served over plain http, where the clipboard API can be unavailable.
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    document.body.removeChild(area);
    note.textContent = "已复制 ✓（web 协议下用回退方式）";
    note.className = "note ok";
  }
};

document.getElementById("baseline").onclick = async () => {
  if (busy) return;
  busy = true;
  try {
    const result = await post("/api/baseline", { seconds: 3 });
    document.getElementById("note").textContent = result.ok ? "开始采集…" : ("没能开始: " + result.note);
  } finally { busy = false; }
  await tick();
};

tick();
setInterval(tick, 350);
</script>
</body>
</html>
